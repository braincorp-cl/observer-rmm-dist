---
observer_mesh_port: 4430
observer_nodejs_version: "20"
observer_meshcentral_version: "1.1.32"
observer_mesh_db_name: meshcentral
observer_mesh_db_user: meshcentral

# --- Mantenimiento de la DB de MeshCentral (fix issue #7787 + retención) ---
# Toggle global del bloque de mantenimiento (índice + LZ4 + purga nocturna).
observer_mesh_db_maintenance: true
# Días de eventos a retener en la tabla `events` (el resto se purga cada noche).
observer_mesh_events_keep_days: 30
# Retención nativa de MeshCentral (dbExpire) para las otras dos tablas de eventos,
# que el cron de #7787 NO toca (solo purga `events`) y crecían sin tope. Paridad con
# prod: powerevents 10d, statsevents 30d. `events` en dbExpire sigue al keep_days del
# cron (una sola fuente de verdad + defensa en profundidad ahora que existe el índice).
observer_mesh_powerevents_keep_days: 10
observer_mesh_statsevents_keep_days: 30
# Tamaño de lote del borrado (COMMIT por lote para no bloquear).
observer_mesh_events_purge_batch: 25000
# Hora (0-23) del cron nocturno de purga.
observer_mesh_events_purge_hour: 1
# Directorio donde se instala el script de purga (en el host de la DB).
observer_mesh_db_maintenance_dir: /opt/observer/scripts

# --- Autobackup nativo de MeshCentral ---
# DESACTIVADO por defecto: observer_backup (GAP-038, cron diario) ya cubre DB+certs+config
# de mesh sin node_modules. El nativo es redundante y, con --dataPath /meshcentral, recursa
# (backupPath dentro del dataPath -> se incluye a sí mismo -> disco lleno). Si se reactiva,
# backupPath DEBE quedar fuera de /meshcentral (ver observer_mesh_autobackup_path) para
# evitar la recursión.
observer_mesh_autobackup_enabled: false
# Fuera de /meshcentral (el dataPath) -> sin recursión cuando el autobackup está activo.
observer_mesh_autobackup_path: "{{ observer_root }}/mesh-autobackups"
observer_mesh_autobackup_keep_days: 7
observer_mesh_autobackup_hour: 6
