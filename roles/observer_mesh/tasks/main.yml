---
# Node.js via nodesource
- name: Descargar script de instalación nodesource
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/setup_{{ observer_nodejs_version }}.x"
    dest: /tmp/nodesource_setup.sh
    mode: "0755"

- name: Ejecutar script nodesource
  ansible.builtin.command: bash /tmp/nodesource_setup.sh
  changed_when: true

- name: Instalar Node.js {{ observer_nodejs_version }}
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

# MeshCentral — NO usa MongoDB; usa PostgreSQL via dbPath
- name: Crear directorio /meshcentral
  ansible.builtin.file:
    path: /meshcentral
    state: directory
    owner: "{{ observer_user }}"
    group: "{{ observer_group }}"
    mode: "0755"

- name: Instalar MeshCentral vía npm, versión {{ observer_meshcentral_version }}
  community.general.npm:
    name: "meshcentral"
    version: "{{ observer_meshcentral_version }}"
    path: /meshcentral
    state: present
  become: true
  become_user: "{{ observer_user }}"

- name: Crear el data dir de MeshCentral
  ansible.builtin.file:
    path: /meshcentral/meshcentral-data
    state: directory
    owner: "{{ observer_user }}"
    group: "{{ observer_group }}"
    mode: "0750"

- name: Desplegar mesh.cfg (config.json de MeshCentral)
  ansible.builtin.template:
    src: mesh.cfg.j2
    # MeshCentral lee su config de meshcentral-data/config.json (NO de la raíz del
    # install). En la raíz se ignora → MeshCentral usa defaults (no bindea el port).
    dest: /meshcentral/meshcentral-data/config.json
    owner: "{{ observer_user }}"
    group: "{{ observer_group }}"
    mode: "0640"
  notify: restart meshcentral

- name: Desplegar meshcentral.service
  ansible.builtin.template:
    src: meshcentral.service.j2
    dest: /etc/systemd/system/meshcentral.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - systemd daemon-reload
    - restart meshcentral

- name: Habilitar y arrancar meshcentral.service
  ansible.builtin.systemd:
    name: meshcentral
    state: started
    enabled: true
    daemon_reload: true

# --- Bring-up de MeshCentral: login token key + cuenta admin (cierra GAP-049) ---
# Reproduce en Ansible la secuencia del install.sh de producción (L991-1038):
#   1) esperar readiness; 2) `--logintokenkey` (idempotente: lee/crea
#      `LoginCookieEncryptionKey` en la DB mesh y lo devuelve — meshcentral.js:3728
#      showLoginTokenKey); 3) crear la cuenta admin una sola vez con el server detenido.
# El token (hex >=160) NO es la contraseña del admin: es la clave con la que MeshCentral
# valida los tokens que Django mina (meshctrl.get_auth_token → bytes.fromhex). Se publica
# como fact para que observer_api lo inyecte en MESH_TOKEN_KEY (local_settings.j2).
- name: "Mesh — esperar a que el HTTP server escuche en el puerto {{ observer_mesh_port }}"
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ observer_mesh_port }}"
    timeout: 180

- name: "Mesh — obtener el login token key (idempotente: persiste en la DB mesh)"
  ansible.builtin.command:
    cmd: "/usr/bin/node /meshcentral/node_modules/meshcentral --logintokenkey"
    chdir: /meshcentral
  become: true
  become_user: "{{ observer_user }}"
  register: observer_mesh_ltk
  changed_when: false

- name: "Mesh — extraer el hex y publicarlo como fact para observer_api"
  ansible.builtin.set_fact:
    observer_mesh_login_token_key: "{{ observer_mesh_ltk.stdout | regex_search('[0-9a-fA-F]{160,}') }}"

- name: "Mesh — validar que el login token key es hex >=160 (si no, el bring-up está roto)"
  ansible.builtin.assert:
    that:
      - observer_mesh_login_token_key is string
      - observer_mesh_login_token_key | length >= 160
    fail_msg: >-
      MeshCentral --logintokenkey no devolvió un hex válido (>=160 chars).
      Revisar que config.json (postgres) y la DB mesh estén disponibles.
    quiet: true

- name: "Mesh — ¿la cuenta admin ya fue creada? (sentinel idempotente)"
  ansible.builtin.stat:
    path: /meshcentral/meshcentral-data/.observer-admin-created
  register: observer_mesh_admin_sentinel

- name: "Mesh — crear la cuenta admin de MeshCentral (una sola vez, server detenido)"
  when: not observer_mesh_admin_sentinel.stat.exists
  block:
    - name: "Mesh — detener meshcentral para crear la cuenta"
      ansible.builtin.systemd:
        name: meshcentral
        state: stopped

    - name: "Mesh — createaccount + adminaccount"
      ansible.builtin.command:
        cmd: "/usr/bin/node /meshcentral/node_modules/meshcentral {{ item }}"
        chdir: /meshcentral
      become: true
      become_user: "{{ observer_user }}"
      loop:
        - "--createaccount {{ observer_mesh_user }} --pass {{ vault_observer_mesh_password }} --email {{ observer_mesh_admin_email }}"
        - "--adminaccount {{ observer_mesh_user }}"
      changed_when: true
      no_log: true  # no filtrar vault_observer_mesh_password al log/ps

    - name: "Mesh — re-arrancar meshcentral"
      ansible.builtin.systemd:
        name: meshcentral
        state: started

    - name: "Mesh — esperar readiness tras crear la cuenta"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ observer_mesh_port }}"
        timeout: 180

    - name: "Mesh — marcar la cuenta admin como creada (sentinel)"
      ansible.builtin.file:
        path: /meshcentral/meshcentral-data/.observer-admin-created
        state: touch
        owner: "{{ observer_user }}"
        group: "{{ observer_group }}"
        mode: "0640"

# --- Mantenimiento de la DB de MeshCentral (fix MeshCentral #7787 + retención) ---
# MeshCentral crea sus tablas (events/eventids/...) en el primer arranque, pero NO crea
# el índice sobre eventids(fkid). Sin ese índice, el borrado de eventos hace seq-scans y
# nunca purga → events crece sin tope y los autobackups llegan a decenas de GB (visto en
# producción: 34-40 GB/backup). Aquí: (1) creamos el índice faltante, (2) comprimimos el
# JSON de inventario HW/SW con LZ4, (3) instalamos un purge nocturno acotado a N días.
# Se ejecuta en el host de la DB (peer auth como postgres), igual que el install.sh upstream.
- name: Mantenimiento de la DB de MeshCentral
  when: observer_mesh_db_maintenance | bool
  delegate_to: "{{ groups['observer_db'][0] }}"
  become: true
  block:
    - name: "Mesh DB — esperar a que MeshCentral cree sus tablas (events, eventids)"
      community.postgresql.postgresql_query:
        login_db: "{{ observer_mesh_db_name }}"
        query: >-
          SELECT to_regclass('public.events') AS events,
                 to_regclass('public.eventids') AS eventids
      become: true
      become_user: postgres
      register: observer_mesh_tables
      until:
        - observer_mesh_tables.query_result[0].events is not none
        - observer_mesh_tables.query_result[0].eventids is not none
      retries: 30
      delay: 5

    - name: "Mesh DB — crear índice idx_eventids_fkid (fix #7787, acelera el purge)"
      community.postgresql.postgresql_idx:
        login_db: "{{ observer_mesh_db_name }}"
        table: eventids
        columns: fkid
        name: idx_eventids_fkid
        concurrent: true
      become: true
      become_user: postgres

    - name: "Mesh DB — leer compresión actual de events.doc"
      community.postgresql.postgresql_query:
        login_db: "{{ observer_mesh_db_name }}"
        query: >-
          SELECT attcompression AS c FROM pg_attribute
          WHERE attrelid = 'public.events'::regclass AND attname = 'doc'
      become: true
      become_user: postgres
      register: observer_mesh_doc_compression
      changed_when: false

    - name: "Mesh DB — comprimir events.doc con LZ4 (inventario HW/SW = JSON grande)"
      # SET COMPRESSION aplica a filas NUEVAS; en una instalación fresca events está
      # vacía, así que toda la data entra comprimida. Recomprimir filas viejas exigiría
      # VACUUM FULL (fuera de alcance: este rol apunta a instalaciones nuevas).
      community.postgresql.postgresql_query:
        login_db: "{{ observer_mesh_db_name }}"
        query: "ALTER TABLE events ALTER COLUMN doc SET COMPRESSION lz4"
      become: true
      become_user: postgres
      when: observer_mesh_doc_compression.query_result[0].c != 'l'

    - name: "Mesh DB — directorio de scripts de mantenimiento"
      ansible.builtin.file:
        path: "{{ observer_mesh_db_maintenance_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Mesh DB — script de purga de eventos antiguos"
      ansible.builtin.template:
        src: clean_mesh_events.sh.j2
        dest: "{{ observer_mesh_db_maintenance_dir }}/clean_mesh_events.sh"
        owner: root
        group: root
        mode: "0750"

    - name: "Mesh DB — asegurar paquete cron (provee crontab + daemon; ausente en Ubuntu mínimo)"
      ansible.builtin.apt:
        name: cron
        state: present
        update_cache: true

    - name: "Mesh DB — cron.service habilitado y activo"
      ansible.builtin.systemd:
        name: cron
        state: started
        enabled: true

    - name: "Mesh DB — cron nocturno de purga de eventos antiguos"
      ansible.builtin.cron:
        name: "observer-mesh purge old events"
        cron_file: observer-mesh-events
        user: root
        minute: "0"
        hour: "{{ observer_mesh_events_purge_hour }}"
        job: "{{ observer_mesh_db_maintenance_dir }}/clean_mesh_events.sh"
