name: No legacy upstream strings

# Gate F008/T019 (D-07 / RN-05) - previene regresiones del rebrand
# TacticalRMM -> Observer RMM en el repo consolidado (backend + infra).
# Espejo del gate del hub 'no-tacticalrmm-regressions' (observer-rmm, RN-024).
#
# ALCANCE: cubre lo que el dist EDITA/POSEE (api/ Python, roles/ Ansible,
# playbooks, scripts). El frontend vive en 'web/' como COPIA del repo
# observer-rmm-web, que tiene su PROPIO gate no-legacy-strings; por eso 'web/'
# se excluye aqui. Rebrand del frontend = deuda de observer-rmm-web
# (componentes <tactical-dropdown>/<tactical-table> + label "Tactical RMM Agent").
#
# PATRON: 'tactical' como token (seguido de no-letra o fin de linea) + las formas
# pegadas tacticalrmm/tacticalagent/tacticalmesh. grep -i => cubre Tactical/TACTICAL.
# Nota: el guard ([^a-z]) NO caza un 'Tactical' PEGADO a otra palabra. El unico
# caso conocido (la clase del adapter SSO en ee/sso) fue renombrado a
# ObserverSocialAdapter el 2026-06-17 (hub+dist, anti-drift), asi que ya no
# queda deuda de token-pegado en el producto.
#
# Exclusiones de linea justificadas (cada grep -vE remueve una categoria revisada):
#   - comentarios de procedencia en smoke.yml, healthcheck.yml y roles/ que citan
#     el install.sh / servidor TacticalRMM de referencia (estandar BrainCorp:
#     instalar EXACTAMENTE como el metodo del upstream).
# Exclusiones por dir: migrations (historia Django congelada), test_data y docs
#   (fixtures / procedencia), web (gate propio del repo web), smoke-results
#   (artefactos de output de pytest), y los caches habituales.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  no-legacy:
    runs-on: ubuntu-latest
    name: Block legacy upstream strings
    steps:
      - uses: actions/checkout@v4

      - name: Scan for legacy strings
        run: |
          set -uo pipefail

          # 'tactical' token (no-letra|fin) + formas pegadas. Ver cabecera.
          PATTERN='tacticalrmm|tacticalagent|tacticalmesh|tactical([^a-z]|$)'

          # -i: cubre Tactical/TACTICAL. 'web/' excluido (gate propio del repo web).
          # Prefijo '\.?/?' tolera greps que emiten o no './' al escanear '.'
          HITS=$(grep -rniE "$PATTERN" \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=__pycache__ \
            --exclude-dir=.pytest_cache \
            --exclude-dir=.mypy_cache \
            --exclude-dir=migrations \
            --exclude-dir=test_data \
            --exclude-dir=docs \
            --exclude-dir=web \
            --exclude-dir=smoke-results \
            . \
            | grep -vE '^\.?/?\.github/workflows/no-legacy-strings\.yml:' \
            | grep -vE '^\.?/?smoke\.yml:[0-9]+:.*servidor TacticalRMM de' \
            | grep -vE '^\.?/?healthcheck\.yml:[0-9]+:.*Observer/TacticalRMM NO usa prefijo' \
            | grep -vE '^\.?/?roles/observer_python/tasks/main\.yml:[0-9]+:.*install\.sh original de TacticalRMM' \
            | grep -vE '^\.?/?roles/observer_db/tasks/main\.yml:[0-9]+:.*servidor TacticalRMM de' \
            | grep -vE '^\.?/?roles/observer_api/tasks/django_deploy\.yml:[0-9]+:.*`tacticalrmm` legacy' \
            || true)

          if [ -n "$HITS" ]; then
            echo "::error::Legacy upstream strings detected outside the documented allowlist."
            echo ""
            echo "Hits:"
            echo "$HITS"
            exit 1
          fi

          echo "::notice::No new legacy upstream strings detected."
