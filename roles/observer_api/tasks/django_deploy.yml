---
# django_deploy.yml — despliegue del código Django + setup inicial
#
# Cubre los pasos faltantes entre "Desplegar local_settings.py" y "Instalar
# NATS Server" del role observer_api: sincronizar el código fuente, instalar
# dependencias Python, correr migraciones de BD, recolectar estáticos y
# generar `nats-rmm.conf` con el user `observerrmm` (cierre cross-repo R-04).
#
# Idempotencia: synchronize usa rsync delta-transfer; pip install respeta
# requirements; migrate/collectstatic/reload_nats son no-op si ya están al día.
#
# Precondición: el control node debe tener el código del hub en
# {{ observer_source_path }} (default: {{ playbook_dir }}/api/observerrmm/ — dist-interno desde F008/D-03;
# relativo a playbook_dir).

- name: Validar que el path del código fuente Django existe en el control node
  ansible.builtin.stat:
    path: "{{ observer_source_path }}"
  delegate_to: localhost
  become: false
  register: observer_source_stat

- name: Fallar si el código fuente no existe
  ansible.builtin.fail:
    msg: >
      No se encontró el código fuente Django en {{ observer_source_path }}.
      Configure `observer_source_path` apuntando al directorio
      api/observerrmm/ del repo observer-rmm en el control node.
  when: not observer_source_stat.stat.exists

- name: Sincronizar código fuente Django al host
  ansible.posix.synchronize:
    src: "{{ observer_source_path }}"
    dest: "{{ observer_root }}/api/{{ observer_app_name }}/"
    delete: false
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.pytest_cache"
      - "--exclude=local_settings.py"
      - "--exclude=nats-rmm.conf"
      - "--exclude=.env"
      # O-IDEMPOTENCIA-01: excluir logs de runtime (private/log/*.log viven en el árbol
      # fuente vía .gitkeep) — sin esto rsync empuja el log vacío del repo sobre el log
      # vivo del server (lo trunca) y reporta changed cada corrida → bouncea la API.
      - "--exclude=*.log"
      # omitir mtime de directorios: evita que el cambio de mtime del dir raíz dispare
      # changed (y los restart handlers) en un re-deploy sin cambios de código.
      - "--omit-dir-times"
      # no propagar permisos: "Crear directorios del API" (main.yml) crea los dirs con
      # mode 0755, pero el checkout del control node los tiene como 775 → archive (-p)
      # los revertía a 775 cada pasada (.d...p) → changed + restart espurio. Con --no-perms
      # el modo lo gobierna la tarea explícita (0755), no los perms accidentales del dev.
      # Seguro: el código Django no depende de bits de ejecución y los secretos (local_settings,
      # .env, nats-rmm.conf) están excluidos del sync.
      - "--no-perms"
  become: true
  become_user: "{{ observer_user }}"
  notify:
    - restart rmm
    - restart daphne
    - restart celery
    - restart celerybeat

- name: Instalar dependencias Python (requirements.txt)
  ansible.builtin.pip:
    requirements: "{{ observer_root }}/api/{{ observer_app_name }}/{{ observer_django_requirements }}"
    virtualenv: "{{ observer_root }}/api/env"
    state: present
  become: true
  become_user: "{{ observer_user }}"
  notify:
    - restart rmm
    - restart daphne
    - restart celery

- name: Ejecutar Django migrate
  ansible.builtin.command:
    cmd: "{{ observer_root }}/api/env/bin/python manage.py migrate --noinput"
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
  register: django_migrate_result
  changed_when: "'No migrations to apply' not in django_migrate_result.stdout"

# Siembra el singleton CoreSettings (= install.sh `initial_db_setup`). Sin esta fila,
# get_core_settings() lanza CoreSettingsNotFound y CUALQUIER login da HTTP 500 en DB
# fresca (LoginViewV2.post la lee antes de autenticar). Idempotente: CoreSettings.save()
# lanza ValidationError si ya existe y el comando lo envuelve en suppress() -> no-op.
- name: Sembrar CoreSettings singleton (initial_db_setup)
  ansible.builtin.command:
    cmd: "{{ observer_root }}/api/env/bin/python manage.py initial_db_setup"
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
  register: observer_initial_db
  changed_when: "'Core db populated' in observer_initial_db.stdout"

# Setup inicial de MeshCentral (= install.sh `sync_mesh_with_trmm`/AddDeviceGroup). Crea el
# device group "ObserverRMM" vía websocket usando el token que get_mesh_ws_url mina con
# MESH_TOKEN_KEY (login token key del rol observer_mesh). También resincroniza el mesh_token
# guardado en CoreSettings con settings.MESH_TOKEN_KEY. Idempotente: solo crea el mesh si no
# existe (action=meshes). Requiere MeshCentral arriba (mismo host: ws://127.0.0.1:4430).
# Cierra GAP-049 (lado device group): sin este paso el backend no resuelve mesh_node_id y la
# generación del instalador / control remoto fallan. Tolera mesh caído (ConnectionClosedError).
- name: Setup inicial de MeshCentral (device group ObserverRMM)
  ansible.builtin.command:
    cmd: "{{ observer_root }}/api/env/bin/python manage.py initial_mesh_setup"
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
  register: observer_initial_mesh
  changed_when: "'Created device group' in observer_initial_mesh.stdout"

- name: Ejecutar Django collectstatic
  ansible.builtin.command:
    cmd: "{{ observer_root }}/api/env/bin/python manage.py collectstatic --noinput"
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
  register: django_collectstatic_result
  changed_when: "'0 static files copied' not in django_collectstatic_result.stdout"

# Secuencia de setup de Django que el install.sh corre tras collectstatic
# (install.sh líneas 571-576). El rol la omitía y por eso:
#   - create_uwsgi_conf NO generaba app.ini -> rmm.service (uwsgi --ini app.ini) crash-loop
#   - create_natsapi_conf NO generaba nats-api.conf -> nats-api crash-loop ("unexpected end of JSON input")
# generate_json_schemas (reporting), load_chocos (Chocolatey) y load_community_scripts
# cargan datos funcionales. create_* escriben en settings.BASE_DIR (el dir del paquete).
- name: Comandos de setup Django (schemas, app.ini, chocos)
  ansible.builtin.command:
    cmd: "{{ observer_root }}/api/env/bin/python manage.py {{ item }}"
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
  loop:
    - generate_json_schemas
    - create_uwsgi_conf
    - load_chocos
  # O-IDEMPOTENCIA-01: generadores deterministas idempotentes (regeneran schemas JSON +
  # app.ini desde el código, y load_chocos siembra data en BD). Antes changed_when:true +
  # notify restart rmm => SIEMPRE reportaban changed y bounceaban rmm en cada deploy. Los
  # cambios REALES de código que afectan su salida ya disparan restart rmm vía el
  # `synchronize` de arriba (ahora idempotente y con detección de cambios correcta);
  # load_chocos es data en BD que no requiere restart. Por eso changed_when:false (no ruido,
  # no restart espurio). Mismo criterio que el refactor checksum de create_natsapi_conf abajo.
  changed_when: false

# F009 (RF-12 ext.): nats-api.conf idempotente. Contiene "key" (= SECRET_KEY, el token
# NATS) + credenciales de PostgreSQL. Antes create_natsapi_conf iba en el loop de arriba
# con changed_when:true (siempre "changed"). Ahora nats-api solo se reinicia si su CONFIG
# cambió (p.ej. rotación de la contraseña de BD o de SECRET_KEY), independiente de
# nats-rmm.conf. Como ambos confs derivan de SECRET_KEY, el token queda siempre sincronizado.
- name: Checksum de nats-api.conf antes de create_natsapi_conf
  ansible.builtin.stat:
    path: "{{ observer_root }}/api/{{ observer_app_name }}/nats-api.conf"
  register: natsapi_conf_before

- name: Generar nats-api.conf (create_natsapi_conf)
  ansible.builtin.command:
    cmd: "{{ observer_root }}/api/env/bin/python manage.py create_natsapi_conf"
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
  changed_when: false

- name: Checksum de nats-api.conf después de create_natsapi_conf
  ansible.builtin.stat:
    path: "{{ observer_root }}/api/{{ observer_app_name }}/nats-api.conf"
  register: natsapi_conf_after

- name: Reiniciar nats-api solo si nats-api.conf cambió
  ansible.builtin.debug:
    msg: "nats-api.conf cambió → se reiniciará nats-api"
  changed_when: >-
    natsapi_conf_before.stat.checksum | default('') !=
    natsapi_conf_after.stat.checksum | default('')
  notify:
    - restart nats-api
    - restart daphne

# Superusuario Django inicial (= install.sh L586 `createsuperuser`). Sin esto no hay
# usuario para entrar al dashboard. No-interactivo vía DJANGO_SUPERUSER_PASSWORD (Django
# 3.0+); idempotente (si el usuario ya existe, createsuperuser retorna error tolerado).
# El admin completa el 2FA (TOTP) en su primer login web.
- name: Crear superusuario Django inicial
  ansible.builtin.command:
    cmd: >-
      {{ observer_root }}/api/env/bin/python manage.py createsuperuser --noinput
      --username {{ observer_admin_user }} --email {{ observer_acme_email }}
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
    DJANGO_SUPERUSER_PASSWORD: "{{ vault_observer_admin_password }}"
  register: observer_createsuperuser
  changed_when: observer_createsuperuser.rc == 0
  failed_when:
    - observer_createsuperuser.rc != 0
    - "'is already taken' not in observer_createsuperuser.stderr"
    - "'already exists' not in observer_createsuperuser.stderr"

# Installer user (= upstream install/update `create_installer_user`). El endpoint
# agents.install_agent hace AuthToken.objects.create(user=<installer_user>, ...) para
# firmar el token de enrolamiento; si no existe ningún User con is_installer_user=True,
# install_agent revienta (FK user_id NOT NULL en el AuthToken). El rol NO lo creaba ->
# en greenfield la generación de instaladores (bash/exe/mac) fallaba 500. El comando es
# idempotente: si ya existe, retorna "Installer user already exists" sin crear otro.
- name: Crear installer user (create_installer_user)
  ansible.builtin.command:
    cmd: "{{ observer_root }}/api/env/bin/python manage.py create_installer_user"
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
  register: observer_installer_user
  changed_when: "'has been created' in observer_installer_user.stdout"

# Community scripts (= install.sh L391-394): el repo se clona a settings.SCRIPTS_DIR
# (= /opt/trmm-community-scripts, ruta legacy en settings.py) y load_community_scripts
# lo carga. Es un RECURSO EXTERNO — decisión BrainCorp pendiente sobre qué repo usar
# (upstream amidaware/community-scripts o un fork braincorp-cl) → O-COMMUNITY-SCRIPTS,
# análogo a R-03 (CDN). OPT-IN: si observer_community_scripts_repo no se define, se omite
# sin bloquear el deploy (el dashboard funciona sin la librería de scripts comunitarios).
- name: Provisionar community scripts (opt-in — requiere observer_community_scripts_repo)
  when: observer_community_scripts_repo | default('') | length > 0
  block:
    - name: Crear SCRIPTS_DIR para community scripts
      ansible.builtin.file:
        path: /opt/trmm-community-scripts
        state: directory
        owner: "{{ observer_user }}"
        group: "{{ observer_group }}"
        mode: "0755"

    - name: Clonar/actualizar el repo de community scripts
      ansible.builtin.git:
        repo: "{{ observer_community_scripts_repo }}"
        dest: /opt/trmm-community-scripts
        version: "{{ observer_community_scripts_version | default('main') }}"
      become: true
      become_user: "{{ observer_user }}"

    - name: Cargar community scripts en la BD (load_community_scripts)
      ansible.builtin.command:
        cmd: "{{ observer_root }}/api/env/bin/python manage.py load_community_scripts"
        chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
      become: true
      become_user: "{{ observer_user }}"
      environment:
        DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
      changed_when: true

- name: Aviso si no se provisionan community scripts
  ansible.builtin.debug:
    msg: >
      observer_community_scripts_repo no definido — se omite load_community_scripts.
      El producto funciona sin la librería de scripts comunitarios; definir el repo
      (decisión BrainCorp, O-COMMUNITY-SCRIPTS) para habilitarla.
  when: observer_community_scripts_repo | default('') | length == 0

# R-04 / CONTRACT-01 — genera nats-rmm.conf con user `observerrmm`
# (no `tacticalrmm` legacy). Backend Django en observerrmm/utils.py:178-256
# escribe el JSON config con `users[0].user = "observerrmm"` y luego intenta
# `nats-server -signal reload` (silenciado si el binario no existe todavía
# — primer deploy: NATS se instala después y arranca leyendo este conf).
# SIN `creates:` a propósito: con el guard, nats-rmm.conf se generaba una sola vez y
# quedaba stale, mientras create_natsapi_conf regenera nats-api.conf cada run → el token
# NATS quedaba desincronizado y nats-api crash-loopea con "Authorization Violation".
# F009 (RF-12): idempotencia. Antes 'changed_when: true' reiniciaba nats + nats-api en
# CADA deploy. Ahora cada servicio se reinicia SOLO si su propio config cambió:
#   - nats     ⟸ nats-rmm.conf (checksum aquí). Deriva de SECRET_KEY (estable) + lista de
#                agentes (users): re-deploys sin altas/bajas dan checksum idéntico → sin restart.
#   - nats-api ⟸ nats-api.conf (checksum en el bloque create_natsapi_conf de arriba).
# nats-api es cliente NATS y auto-reconecta cuando nats reinicia, así que no necesita
# restart por cambios de nats-rmm.conf. Ambos confs derivan de SECRET_KEY → token sincronizado.
# (El comando regenera el conf siempre e internamente hace 'nats-server -signal reload',
# que es una recarga en caliente no disruptiva; lo que se evita es el restart systemd.)
- name: Checksum de nats-rmm.conf antes de reload_nats
  ansible.builtin.stat:
    path: "{{ observer_root }}/api/{{ observer_app_name }}/nats-rmm.conf"
  register: nats_conf_before

- name: Ejecutar Django reload_nats (cierre R-04 — genera nats-rmm.conf con user observerrmm)
  ansible.builtin.command:
    cmd: "{{ observer_root }}/api/env/bin/python manage.py reload_nats"
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
  register: reload_nats_result
  changed_when: false

- name: Checksum de nats-rmm.conf después de reload_nats
  ansible.builtin.stat:
    path: "{{ observer_root }}/api/{{ observer_app_name }}/nats-rmm.conf"
  register: nats_conf_after

- name: Reiniciar nats solo si nats-rmm.conf cambió
  ansible.builtin.debug:
    msg: "nats-rmm.conf cambió → se reiniciará nats"
  changed_when: >-
    nats_conf_before.stat.checksum | default('') !=
    nats_conf_after.stat.checksum | default('')
  notify:
    - restart nats

- name: Verificar que nats-rmm.conf contiene user observerrmm (smoke test R-04)
  ansible.builtin.command:
    cmd: "grep -q '\"observerrmm\"' {{ observer_root }}/api/{{ observer_app_name }}/nats-rmm.conf"
  changed_when: false
  register: nats_user_grep
  failed_when: nats_user_grep.rc != 0
