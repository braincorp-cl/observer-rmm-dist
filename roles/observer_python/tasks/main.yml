---
# Python {{ observer_python_full_version }} compilado desde fuente (python.org),
# espejo EXACTO del método del install.sh original del que se portó:
#   ./configure --enable-optimizations && make -j $(nproc) && make altinstall
# altinstall NO toca el python3 del sistema; instala /usr/local/bin/python3.11.
# NO se usa apt/PPA para Python (decisión BrainCorp: solo métodos del install.sh).
# Idempotente: no recompila si la versión exacta ya está instalada.

- name: Verificar versión de Python instalada
  ansible.builtin.command:
    cmd: "/usr/local/bin/python{{ observer_python_version }} --version"
  register: observer_python_installed
  changed_when: false
  failed_when: false

- name: Compilar e instalar Python desde fuente, versión {{ observer_python_full_version }}
  when: >-
    observer_python_installed.rc != 0
    or observer_python_full_version not in observer_python_installed.stdout
  block:
    - name: Instalar dependencias de build (mismas del install.sh)
      ansible.builtin.apt:
        name:
          - build-essential
          - zlib1g-dev
          # libncurses-dev y NO libncurses5-dev: el nombre con el 5 desaparecio en
          # Ubuntu 26.04 (verificado: no esta en resolute). El sin numero existe en
          # las tres (jammy 6.3, noble 6.4, resolute 6.6), asi que sirve para todas.
          - libncurses-dev
          - libgdbm-dev
          - libnss3-dev
          - libssl-dev
          - libreadline-dev
          - libffi-dev
          - libsqlite3-dev
          - libbz2-dev
        state: present
        update_cache: true

    # /var/tmp y no /tmp: desde Ubuntu 24.10 (y en Debian 13) /tmp es tmpfs, o sea RAM.
    # Aca no es un detalle: el arbol de compilacion de CPython con --enable-optimizations
    # pasa de 1 GB, y en un servidor chico eso es la diferencia entre compilar y que el
    # OOM killer se lleve algo. /var/tmp es disco y sobrevive reinicios.
    - name: Descargar fuente de Python {{ observer_python_full_version }}
      ansible.builtin.get_url:
        url: "https://www.python.org/ftp/python/{{ observer_python_full_version }}/Python-{{ observer_python_full_version }}.tgz"
        dest: "/var/tmp/Python-{{ observer_python_full_version }}.tgz"
        mode: "0644"

    - name: Extraer fuente
      ansible.builtin.unarchive:
        src: "/var/tmp/Python-{{ observer_python_full_version }}.tgz"
        dest: /var/tmp
        remote_src: true

    - name: Compilar e instalar (make altinstall)
      ansible.builtin.shell:
        cmd: "./configure --enable-optimizations && make -j $(nproc) && make altinstall"
        chdir: "/var/tmp/Python-{{ observer_python_full_version }}"

    - name: Limpiar fuentes de build
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/var/tmp/Python-{{ observer_python_full_version }}"
        - "/var/tmp/Python-{{ observer_python_full_version }}.tgz"
