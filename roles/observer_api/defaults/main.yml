---
observer_python_version: "3.11"
observer_nats_version: "2.14.0"
observer_nats_port: 4222
observer_nats_ws_port: 9235
observer_nats_host: "127.0.0.1"
celery_min_workers: 2
celery_max_workers: 20
# Intervalos de check-in (segundos). GAP-052: recalibrados a los defaults upstream del
# agente (responsivos para flotas normales); los valores F009 previos (disks ~2.8d,
# wmi hasta ~70h) dejaban a un agente recién enrolado sin inventario por horas/días.
# El ÚNICO con riesgo real de OOM en MeshCentral es syncmesh → se mantiene >= 3600
# (lección MINSAL). Para flotas muy grandes (~28k agentes), subir agentinfo/disks/
# hw_assets vía group_vars (estos defaults los parametriza el rol; override per-site).
observer_checkin_hello_min: 30
observer_checkin_hello_max: 60
observer_checkin_agentinfo_min: 200
observer_checkin_agentinfo_max: 400
observer_checkin_win_services_min: 2400
observer_checkin_win_services_max: 3000
observer_checkin_pubip_min: 300
observer_checkin_pubip_max: 500
observer_checkin_disks_min: 1000
observer_checkin_disks_max: 2000
observer_checkin_sw_inventory_min: 2800
observer_checkin_sw_inventory_max: 3500
observer_checkin_hw_assets_min: 3000
observer_checkin_hw_assets_max: 4000
observer_checkin_syncmesh_min: 3600
observer_checkin_syncmesh_max: 7200
observer_check_interval_jitter_min: 3
observer_check_interval_jitter_max: 120
observer_checkin_geo_min: 1500
observer_checkin_geo_max: 2100
observer_nats_max_connections: 50000
# Feature 023/026 — key de Google Geolocation, server-side. Vacía por default: sin key
# la resolución WiFi queda apagada y el agente degrada a IP. Se setea por vault.
observer_google_geolocation_api_key: ""

# Cola de escucha del socket uWSGI (backport v1.5.1 B2): create_uwsgi_conf emite
# `listen = {{ UWSGI_LISTEN_QUEUE|default(1024) }}`, pero el kernel recorta el backlog
# real de listen() al valor de net.core.somaxconn. Con flotas grandes y check-ins
# simultáneos, un somaxconn bajo (128 en kernels viejos) produce "connection refused"
# en picos. Este valor es un PISO: debe ser >= UWSGI_LISTEN_QUEUE (1024) y, como el
# task usa sysctl con valor absoluto, NO debe rebajar hosts ya bien configurados. Se fija
# en 4096 = default de Ubuntu moderno (kernel >= 5.4): en esos hosts el task es no-op, y en
# kernels viejos sube de verdad (128 -> 4096). Si subes UWSGI_LISTEN_QUEUE por encima de
# 4096, sube esto también. (Verificado en staging 2026-07-14: host ya en 4096 -> no-op.)
observer_api_somaxconn: 4096

# sslmode del cliente nats-api (Go/lib/pq) → PostgreSQL, leído por settings.DB_SSL en
# create_natsapi_conf. lib/pq solo soporta disable/require/verify-ca/verify-full (NO 'prefer').
# 'require' cifra sin verificar CA (correcto con el cert snakeoil del rol observer_db, ssl=on).
# Cierra el residual O-DIFF-PGAUTH (el default del comando era 'disable' = en plano).
# Solo afecta a nats-api; el cliente Django usa el default de libpq (prefer) por separado.
observer_db_sslmode: require

# Django source deployment (consumido por tasks/django_deploy.yml)
# observer_source_path: path del código fuente Django en el control node.
#   Default asume layout sibling: observer-rmm-dist/ y observer-rmm/ comparten parent dir.
#   Override en inventory si el layout es distinto o si se usa otra estrategia (git, etc).
# Post-consolidación F008: el dist es self-contained (D-03)
observer_source_path: "{{ playbook_dir }}/api/observerrmm/"
observer_django_requirements: "requirements.txt"

# Reporting (ee/reporting) — dashboards con gráficos (W005). Kaleido 1.x NO empaqueta
# chromium; genera los gráficos-imagen (SVG, obligatorio en PDF: WeasyPrint no ejecuta JS)
# lanzando un chromium del sistema. Con esto en true, plotly_get_chrome descarga un chromium
# versión-matcheada a la caché de Kaleido (bajo HOME={{ observer_root }}, el mismo HOME con
# que corren rmm/daphne/celery → autodescubierto al renderizar). Es una descarga externa
# (storage.googleapis.com) SOLO en provisión, análoga a Python/NATS. Poner en false para
# instalaciones mínimas: los reportes de texto/tabla y PDF-sin-gráfico funcionan sin chromium.
observer_reporting_charts_enabled: true
