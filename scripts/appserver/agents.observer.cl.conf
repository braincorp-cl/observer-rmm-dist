# agents.observer.cl — CDN propio de binarios del agente Observer RMM.
#
# Solucion definitiva R-03 (faceta CDN): sirve los binarios del agente desde
# infra propia en vez de depender de github.com/.../releases. TLS lo termina el
# NPM corporativo aguas arriba; este backend sirve HTTP plano en :83.
#
# Sirve DOS rutas hacia el mismo archivo (unsigned; firma diferida ADR-018):
#   (a) estatica, espejo del path de GitHub — la usa hoy get_agent_url (rama sin token):
#       /releases/download/v{ver}/observeragent-v{ver}-{plat}-{arch}[.exe]
#   (b) API por query params (compatibilidad con el CDN de agentes upstream) — la
#       usara get_agent_url cuando exista un CodeSignToken (settings.AGENTS_URL):
#       /api/v2/agents/?version={ver}&arch={arch}&plat={plat}&token=...&api=...
#
# Los binarios los publica scripts/appserver/observer-agents-cdn-publish.sh.
# Provenance del deploy: instalado en /etc/apache2/sites-available/ del appserver 10.20.0.52.
Listen 83

<VirtualHost *:83>
    ServerName agents.observer.cl
    ServerAdmin soporte@observer.cl

    DocumentRoot /var/www/html/observer-agents

    # NPM aguas arriba reenvia la IP real (mismo patron que los otros vhosts).
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.0.0.0/8

    RewriteEngine On

    # --- Ruta (b): API por query params. Captura version/arch/plat de la query
    # (orden-independiente) en variables de entorno y reescribe internamente al
    # archivo estatico. El token se ignora a proposito: binarios unsigned.
    RewriteCond %{QUERY_STRING} (?:^|&)version=([^&]+)
    RewriteRule .* - [E=AGV:%1]
    RewriteCond %{QUERY_STRING} (?:^|&)arch=([^&]+)
    RewriteRule .* - [E=AGA:%1]
    RewriteCond %{QUERY_STRING} (?:^|&)plat=([^&]+)
    RewriteRule .* - [E=AGP:%1]

    # windows -> sufijo .exe
    RewriteCond %{ENV:AGP} =windows
    RewriteRule "^/api/v2/agents/?$" "/releases/download/v%{ENV:AGV}/observeragent-v%{ENV:AGV}-windows-%{ENV:AGA}.exe?" [L]
    # linux/darwin -> sin extension (solo si se resolvio la version)
    RewriteCond %{ENV:AGV} !=""
    RewriteRule "^/api/v2/agents/?$" "/releases/download/v%{ENV:AGV}/observeragent-v%{ENV:AGV}-%{ENV:AGP}-%{ENV:AGA}?" [L]

    # Endurecimiento: sin listado; 403 al directorio y a cualquier ruta que no sea
    # un binario del agente. Descarga solo por ruta exacta (mismo patron que /agents/).
    <Directory /var/www/html/observer-agents>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all denied
        <FilesMatch "^observeragent-v[0-9]">
            Require all granted
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/agents.observer.cl-error.log
    CustomLog ${APACHE_LOG_DIR}/agents.observer.cl-access.log vhost_combined
</VirtualHost>
