---
# install.yml — Playbook principal Observer RMM Distributed
# Despliega todos los componentes en orden de dependencias.
# Compatible con inventory/all-in-one.yml (dev) e inventory/production.yml (prod).
#
# Uso:
#   ansible-playbook install.yml -i inventory/production.yml --ask-vault-pass
#   ansible-playbook install.yml -i inventory/all-in-one.yml --ask-vault-pass
#   ansible-playbook install.yml --tags skip_checks -i inventory/production.yml --ask-vault-pass

- name: Pre-checks
  hosts: localhost
  gather_facts: false
  tags: [pre_checks]
  tasks:
    - name: Validar que todos los grupos estén definidos
      ansible.builtin.assert:
        that:
          - groups['observer_db'] | length > 0
          - groups['observer_redis'] | length > 0
          - groups['observer_mesh'] | length > 0
          - groups['observer_api'] | length > 0
          - groups['observer_proxy'] | length > 0
        fail_msg: >
          Faltan grupos en el inventario.
          Grupos requeridos: observer_db, observer_redis, observer_mesh, observer_api, observer_proxy.
          Revise el archivo de inventario que está usando.

    - name: Verificar que vault.yml no contenga CHANGEME (credenciales sin configurar)
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/group_vars"
        patterns: "vault.yml"
        recurse: true
      register: vault_files

    - name: Leer vault files buscando CHANGEME
      ansible.builtin.shell: "grep -l CHANGEME {{ item.path }} 2>/dev/null || true"
      register: changeme_check
      loop: "{{ vault_files.files }}"
      changed_when: false

    - name: Fallar si hay CHANGEME en vault
      ansible.builtin.fail:
        msg: >
          Se encontró 'CHANGEME' en {{ item.item.path }}.
          Configure las credenciales reales y cifre con ansible-vault antes de desplegar.
          Para omitir esta validación use: --tags skip_checks
      when: item.stdout | length > 0
      loop: "{{ changeme_check.results }}"
      tags: [never, skip_checks_guard]

- name: Build del frontend SPA en el control node (genera web/dist/, gitignored — ver web/BUILD.md)
  # web/dist/ NO se versiona (.gitignore): se regenera aquí, en el control node, ANTES de
  # que el rol observer_proxy lo sincronice (synchronize src: {{ playbook_dir }}/web/dist/).
  # Corre temprano para fallar rápido si falta el toolchain, antes de tocar hosts remotos.
  # Omitir con -e observer_frontend_build=false (p.ej. re-deploy sin cambios de frontend,
  # usando el web/dist/ ya construido) o seleccionar con --tags frontend_build.
  hosts: localhost
  gather_facts: false
  tags: [frontend_build]
  vars:
    observer_frontend_build: true
    observer_web_app_dir: "{{ playbook_dir }}/web/app"
    observer_web_dist_dir: "{{ playbook_dir }}/web/dist"
  tasks:
    - name: Build del frontend (omitible con observer_frontend_build=false)
      when: observer_frontend_build | bool
      block:
        - name: Verificar que npm está disponible en el control node
          ansible.builtin.command: npm --version
          register: _observer_npm_ver
          changed_when: false
          failed_when: _observer_npm_ver.rc != 0

        - name: Informar versión de Node/npm (referencia Node 22.22.2, ver web/BUILD.md)
          ansible.builtin.command: node --version
          register: _observer_node_ver
          changed_when: false
          failed_when: false

        - name: Mostrar toolchain detectado
          ansible.builtin.debug:
            msg: "Control node: node {{ _observer_node_ver.stdout | default('?') }}, npm {{ _observer_npm_ver.stdout }} (referencia Node 22.22.2)"

        - name: Instalar dependencias del frontend (npm ci, reproducible desde lockfile)
          ansible.builtin.command:
            cmd: npm ci
            chdir: "{{ observer_web_app_dir }}"
          changed_when: true

        - name: Compilar el SPA (quasar build)
          ansible.builtin.command:
            cmd: npm run build
            chdir: "{{ observer_web_app_dir }}"
          changed_when: true

        - name: Reconstituir el artefacto desplegable web/dist/ desde el output del build
          # Espeja el procedimiento documentado en web/BUILD.md (maneja salida en dist/ o dist/spa/).
          ansible.builtin.shell: |
            set -euo pipefail
            OUT="{{ observer_web_app_dir }}/dist"
            [ -f "$OUT/spa/index.html" ] && OUT="$OUT/spa"
            rm -rf "{{ observer_web_dist_dir }}"
            cp -r "$OUT" "{{ observer_web_dist_dir }}"
            test -s "{{ observer_web_dist_dir }}/index.html"
          args:
            executable: /bin/bash
          changed_when: true

        - name: Confirmar artefacto generado
          ansible.builtin.debug:
            msg: "web/dist/ regenerado en el control node — observer_proxy lo sincronizará al servidor."

- name: Dependencias comunes — todos los hosts
  hosts: all
  roles:
    - observer_common

- name: Base de datos PostgreSQL
  hosts: observer_db
  roles:
    - observer_db

- name: Cache Redis
  hosts: observer_redis
  roles:
    - observer_redis

- name: MeshCentral
  hosts: observer_mesh
  roles:
    - observer_mesh

- name: API Django + NATS + Celery
  hosts: observer_api
  roles:
    - observer_api

- name: Proxy nginx + SSL
  hosts: observer_proxy
  roles:
    - observer_proxy

- name: Backups (DB principal + mesh + certs + config) — cierra GAP-038
  hosts: observer_api
  roles:
    - observer_backup

- name: Resumen de acceso — URLs y credenciales iniciales (= install.sh L1063-1068, GAP-058)
  # Última tarea del install: imprime en CLARO las URLs y las credenciales de acceso
  # iniciales, replicando el cierre del install.sh original (que terminaba con
  # "Installation complete! / Access your rmm at / MeshCentral username+password").
  # Las credenciales se leen del vault vía hostvars del primer host de cada grupo, por lo
  # que funciona igual en all-in-one (un host en todos los grupos) y en multi-host.
  # Este es el ÚNICO punto del playbook donde los secretos se muestran en claro, y solo al
  # instalar: no_log queda desactivado A PROPÓSITO aquí. Guarde estas credenciales y limpie
  # la salida del terminal / logs de CI después de leerlas.
  hosts: observer_proxy
  gather_facts: false
  tags: [summary, access_summary]
  tasks:
    - name: Mostrar URLs y credenciales de acceso iniciales
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "  Observer RMM — instalación completa"
          - "============================================================"
          - "  Consola RMM (web):   https://{{ observer_app_domain }}"
          - "  API backend:         https://{{ observer_domain }}"
          - "  MeshCentral:         https://{{ observer_mesh_domain }}"
          - "------------------------------------------------------------"
          - "  CREDENCIALES INICIALES — guárdelas en un gestor seguro y"
          - "  limpie esta salida del terminal después de leerlas."
          - ""
          - "  Consola RMM  (https://{{ observer_app_domain }})"
          - "    usuario:  {{ observer_admin_user }}"
          - "    password: {{ hostvars[groups['observer_api'][0]]['vault_observer_admin_password'] }}"
          - "    (se le pedirá configurar 2FA/TOTP en el primer login web)"
          - ""
          - "  MeshCentral  (https://{{ observer_mesh_domain }})"
          - "    usuario:  {{ hostvars[groups['observer_api'][0]]['observer_mesh_user'] }}"
          - "    password: {{ hostvars[groups['observer_mesh'][0]]['vault_observer_mesh_password'] }}"
          - "    (cuenta de administración total de MeshCentral)"
          - "============================================================"
