---
# MeshCentral — observer_mesh host

observer_mesh_port: 4430
observer_nodejs_version: "20"
# 1.2.1 (2026-06-24): primer release que empaqueta el core mac con soporte
# de captura para macOS 26 "Tahoe" (audit session #344 + KVM LaunchAgent #349).
# El core anterior (ago-2022) daba pantalla negra en "Tomar control" en macOS 26.
# 1.2.1 > 1.1.44, así que conserva el fix de autobackup PG de MeshCentral.
#
# ESTÁNDAR GLOBAL (2026-07-08): 1.2.1 es LA versión para TODAS las plataformas
# (server + Linux + Windows 10/11 + macOS). KVM validado en vivo en server/Linux/
# Win10/Win11. Caveat conocido: el AGENTE mesh 1.2.1 crashea en macOS 26 arm64
# (bug del core upstream Ylianst/MeshAgent#359, trackeado). NO es bloqueante para
# estandarizar: el core anterior tampoco servía KVM en macOS 26 (pantalla negra),
# así que no hay regresión de capacidad útil. El "hold macOS" previo queda LEVANTADO.
observer_meshcentral_version: "1.2.1"

# Base de datos PostgreSQL para MeshCentral
# MeshCentral usa PostgreSQL (NO MongoDB)
observer_mesh_db_name: meshcentral
observer_mesh_db_user: meshcentral

# Hostname del API para integración MeshCentral→TRMM — REQUERIDO
# observer_api_host: "10.50.0.14"
