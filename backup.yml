---
# backup.yml — Backup coordinado Observer RMM
# Uso: ansible-playbook backup.yml -i inventory/production.yml --ask-vault-pass

- name: Backup — PostgreSQL
  hosts: observer_db
  vars:
    # OJO: un lookup() en `vars` se REEVALÚA en cada referencia, así que `date` daba
    # un timestamp distinto por tarea y el chown/verificación buscaban un archivo que
    # no existía (el dump quedaba huérfano, con otro nombre). ansible_date_time viene
    # de los facts (bajo ansible_facts, porque ansible.cfg tiene inject_facts_as_vars=false):
    # se calcula una vez por host y es estable en todo el playbook.
    backup_ts: "{{ ansible_facts.date_time.iso8601_basic_short }}"
  tasks:
    - name: Crear directorio de backups
      ansible.builtin.file:
        path: "{{ observer_root }}/backups"
        state: directory
        owner: "{{ observer_user }}"
        group: "{{ observer_group }}"
        mode: "0750"

    # El rol de PG es `postgres`, pero el directorio de backups es de {{ observer_user }}
    # con modo 0750: si postgres escribe el archivo directo (pg_dump -f) falla con
    # "Permission denied" y el backup NO se hace. Por eso se dumpea a stdout como
    # postgres y redirige root, que sí puede escribir ahí.
    - name: pg_dump de las bases (observerrmm y meshcentral)
      become: true
      ansible.builtin.shell:
        cmd: >
          set -o pipefail &&
          sudo -u postgres pg_dump -Fc {{ item }}
          > {{ observer_root }}/backups/{{ item }}_{{ backup_ts }}.dump
        executable: /bin/bash
      loop:
        - observerrmm
        - meshcentral
      changed_when: true

    - name: Dueño y permisos de los dumps
      become: true
      ansible.builtin.file:
        path: "{{ observer_root }}/backups/{{ item }}_{{ backup_ts }}.dump"
        owner: "{{ observer_user }}"
        group: "{{ observer_group }}"
        mode: "0640"
      loop:
        - observerrmm
        - meshcentral

    # Un pg_dump puede salir 0 y dejar un archivo inservible (disco lleno, redirección
    # rota). El backup solo cuenta si el archivo existe y tiene contenido.
    - name: Comprobar que los dumps existen y no están vacíos
      become: true
      ansible.builtin.stat:
        path: "{{ observer_root }}/backups/{{ item }}_{{ backup_ts }}.dump"
      register: observer_dump_stat
      loop:
        - observerrmm
        - meshcentral

    - name: Fallar si algún dump quedó vacío
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 1024
        fail_msg: >
          El dump {{ item.item }} no se generó o quedó vacío
          ({{ item.stat.size | default(0) }} bytes) — NO continuar con el deploy.
        success_msg: "Dump {{ item.item }} OK ({{ item.stat.size }} bytes)"
      loop: "{{ observer_dump_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verificar que backups no contienen vault_ en texto
      become: true
      ansible.builtin.shell: >
        strings {{ observer_root }}/backups/observerrmm_{{ backup_ts }}.dump |
        grep -c "vault_" || true
      register: vault_check
      changed_when: false

    - name: Warn si se detectan posibles credenciales
      ansible.builtin.debug:
        msg: "ADVERTENCIA: se detectaron referencias vault_ en el dump"
      when: vault_check.stdout | int > 0

- name: Backup — API (configuración y código)
  hosts: observer_api
  vars:
    backup_ts: "{{ ansible_facts.date_time.iso8601_basic_short }}"
  tasks:
    - name: Tarball de configuración API
      ansible.builtin.archive:
        path: "{{ observer_root }}/api/{{ observer_app_name }}"
        dest: "{{ observer_root }}/backups/api_config_{{ backup_ts }}.tar.gz"
        format: gz
        exclusion_patterns:
          - "*.pyc"
          - "__pycache__"

- name: Backup — MeshCentral (configuración)
  hosts: observer_mesh
  vars:
    backup_ts: "{{ ansible_facts.date_time.iso8601_basic_short }}"
  tasks:
    - name: Tarball de configuración MeshCentral
      become: true      # /meshcentral/config.json no es legible por {{ observer_user }}
      ansible.builtin.archive:
        path: /meshcentral/config.json
        dest: "{{ observer_root }}/backups/meshcentral_config_{{ backup_ts }}.tar.gz"
        format: gz
