---
# Variables globales — compartidas por todos los roles

# Sistema operativo
observer_user: observer
observer_group: observer
observer_app_name: observerrmm   # Nombre del módulo Django (naming canónico RN-01):
                                  # - WorkingDirectory: /opt/observer/api/observerrmm/
                                  # - CELERY_APP: observerrmm
                                  # - ASGI: observerrmm.asgi:application
observer_root: /opt/observer
observer_log_dir: /opt/observer/logs

# Dominio — REQUERIDO, sin valor por defecto
# observer_domain: "rmm.ejemplo.cl"

# Identidad de conexión a la BD — COMPARTIDA cross-rol/cross-host: el rol observer_db
# la usa para crear la BD/usuario y el rol observer_api para conectarse (local_settings).
# Debe vivir aquí (no en defaults del rol observer_db) o el rol observer_api no la ve.
observer_db_name: observerrmm
observer_db_user: observerrmm
observer_db_port: 5432

# Superusuario Django inicial (= install.sh `createsuperuser`). El password va en
# vault (vault_observer_admin_password). El admin completa 2FA en el primer login web.
observer_admin_user: observeradmin

# Validación de versión mínima de Ansible
observer_min_ansible_version: "2.15"
