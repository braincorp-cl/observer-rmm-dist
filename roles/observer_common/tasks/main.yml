---
- name: Validar versión mínima de Ansible
  ansible.builtin.assert:
    that:
      - ansible_version.full is version(observer_min_ansible_version, '>=')
    fail_msg: >
      Se requiere ansible-core >= {{ observer_min_ansible_version }}.
      Versión actual: {{ ansible_version.full }}.
      Ejecute: pip install --upgrade ansible-core

- name: Instalar dependencias APT
  ansible.builtin.apt:
    name: "{{ observer_common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Crear grupo del sistema observer
  ansible.builtin.group:
    name: "{{ observer_group }}"
    system: true
    state: present

# El usuario observer puede ser TAMBIÉN el usuario de deploy/SSH (modelo install.sh:
# se instala como el usuario de servicio). En ese caso ya existe y está logueado, y
# usermod -d (cambio de home) falla con "user is currently used by process". Por eso:
# crear solo si no existe; si ya existe, no modificarlo destructivamente.
- name: Comprobar si el usuario observer ya existe
  ansible.builtin.command: "getent passwd {{ observer_user }}"
  register: observer_user_check
  changed_when: false
  failed_when: false

- name: Crear usuario del sistema observer (solo si no existe)
  ansible.builtin.user:
    name: "{{ observer_user }}"
    group: "{{ observer_group }}"
    groups:
      - "{{ observer_group }}"
      - www-data
    home: "{{ observer_root }}"
    shell: /bin/bash
    system: true
    create_home: true
    state: present
  when: observer_user_check.rc != 0

- name: Asegurar membresía de www-data del usuario observer (no destructivo)
  ansible.builtin.user:
    name: "{{ observer_user }}"
    groups:
      - www-data
    append: true
  when: observer_user_check.rc == 0

- name: Asegurar el directorio raíz de la app observer
  ansible.builtin.file:
    path: "{{ observer_root }}"
    state: directory
    owner: "{{ observer_user }}"
    group: "{{ observer_group }}"
    mode: "0755"

- name: Crear directorio de logs
  ansible.builtin.file:
    path: "{{ observer_log_dir }}"
    state: directory
    owner: "{{ observer_user }}"
    group: "{{ observer_group }}"
    mode: "0755"

# Resolución local de los 3 FQDN — FIEL a install.sh (L203-219). El host debe resolver
# sus propios dominios (api/frontend/mesh) para que nginx, MeshCentral y los smoke checks
# funcionen sin depender de DNS externo. En all-in-one apuntan a 127.0.1.1.
- name: Comprobar si existe cloud-init
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg
  register: observer_cloud_cfg

- name: Desactivar manage_etc_hosts de cloud-init (no sobrescribir /etc/hosts en reboot)
  ansible.builtin.lineinfile:
    path: /etc/cloud/cloud.cfg
    regexp: '^\s*manage_etc_hosts:'
    line: "manage_etc_hosts: false"
  when: observer_cloud_cfg.stat.exists

- name: Registrar FQDN del sistema en /etc/hosts (auto-resolución, install.sh L203-219)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127\\.0\\.1\\.1 .*{{ observer_domain | regex_escape }}"
    line: "127.0.1.1 {{ observer_domain }} {{ observer_app_domain }} {{ observer_mesh_domain }}"
    state: present
  when:
    - observer_domain is defined
    - observer_app_domain is defined
    - observer_mesh_domain is defined

- name: Configurar UFW — política por defecto
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: observer_ufw_enabled

- name: Configurar UFW — reglas base
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default('') }}"
  loop: "{{ observer_ufw_base_rules }}"
  when: observer_ufw_enabled

- name: Configurar UFW — reglas del rol
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    src: "{{ item.src | default(omit) }}"
    comment: "{{ item.comment | default('') }}"
  loop: "{{ observer_ufw_rules | default([]) }}"
  when: observer_ufw_enabled
