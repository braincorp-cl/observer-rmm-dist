---
observer_python_version: "3.11"

# Email del superusuario Django. Es un concepto distinto del email de registro de ACME,
# aunque hoy compartan valor cuando el certificado se emite por ACME: uno identifica al
# administrador de la consola, el otro a quien registra el certificado.
#
# Estaban acoplados y el acoplamiento se rompia solo: `django_deploy.yml` usaba
# `observer_acme_email` directo, que vive en los defaults de observer_proxy — otro rol, y
# que corre DESPUES. Andaba nada mas porque install.sh siempre lo escribia en el
# inventario. Al instalar con certificado propio (observer_cert_mode: byo) deja de haber
# email de ACME, y la creacion del superusuario fallaba con 'observer_acme_email' is
# undefined tras doce minutos de instalacion, con todo lo demas ya puesto.
#
# El `or` de Jinja y no `| default()`: default solo actua sobre una variable INDEFINIDA, y
# aca el valor puede llegar definido pero vacio (es el default de observer_proxy).
observer_admin_email: "{{ (observer_acme_email | default('')) or ('admin@' + (observer_base_domain | default('localhost'))) }}"
observer_nats_version: "2.15.1"
# SHA256 de los tarballs de la release, tomados del SHA256SUMS que publica nats-io.
# Van por arquitectura porque el tarball es distinto en cada una. Al subir el pin hay
# que reemplazar los dos: un checksum viejo con un pin nuevo falla la descarga, que es
# el comportamiento que se quiere (falla ruidosa, no instalacion silenciosa).
observer_nats_sha256:
  amd64: "bf5edc7b1ce98e885c368cb43a886eb148dc5d0551d99f3cf6141fb5e1954c70"
  arm64: "e2fbab4cad7d3c76e3052eb959570393c9d73ba756b70bf8e9eea61e9ae6d49c"
observer_nats_port: 4222
observer_nats_ws_port: 9235
observer_nats_host: "127.0.0.1"
celery_min_workers: 2
celery_max_workers: 20
# Intervalos de check-in (segundos). GAP-052: recalibrados a los defaults upstream del
# agente (responsivos para flotas normales); los valores F009 previos (disks ~2.8d,
# wmi hasta ~70h) dejaban a un agente recién enrolado sin inventario por horas/días.
# El ÚNICO con riesgo real de OOM en MeshCentral es syncmesh → se mantiene >= 3600
# (lección MINSAL). Para flotas muy grandes (~28k agentes), subir agentinfo/disks/
# hw_assets en el INVENTARIO del ambiente — no en group_vars/, que le gana al inventario
# y dejaría el override decorativo (por eso el bloque salió de ahí el 2026-08-15).
observer_checkin_hello_min: 30
observer_checkin_hello_max: 60
observer_checkin_agentinfo_min: 200
observer_checkin_agentinfo_max: 400
observer_checkin_win_services_min: 2400
observer_checkin_win_services_max: 3000
observer_checkin_pubip_min: 300
observer_checkin_pubip_max: 500
observer_checkin_disks_min: 1000
observer_checkin_disks_max: 2000
observer_checkin_sw_inventory_min: 2800
observer_checkin_sw_inventory_max: 3500
observer_checkin_hw_assets_min: 3000
observer_checkin_hw_assets_max: 4000
observer_checkin_syncmesh_min: 3600
observer_checkin_syncmesh_max: 7200
observer_check_interval_jitter_min: 3
observer_check_interval_jitter_max: 120
observer_checkin_geo_min: 1500
observer_checkin_geo_max: 2100
observer_nats_max_connections: 50000
# Feature 023/026 — key de Google Geolocation, server-side. Vacía por default: sin key
# la resolución WiFi queda apagada y el agente degrada a IP. Se setea por vault.
observer_google_geolocation_api_key: ""

# Versión del agente que el servidor OFRECE a la flota. Vacía por default = manda el
# LATEST_AGENT_VER de settings.py (la del producto). Sirve para desacoplar un ambiente
# del resto: publicar un binario al CDN NO mueve a nadie — get_agent_url() arma la ruta
# con settings.LATEST_AGENT_VER, así que el CDN es solo el depósito y esta variable es
# la que decide qué baja la flota. Subirla aquí es lo que dispara la auto-actualización.
observer_latest_agent_ver: ""

# Cola de escucha del socket uWSGI (backport v1.5.1 B2): create_uwsgi_conf emite
# `listen = {{ UWSGI_LISTEN_QUEUE|default(1024) }}`, pero el kernel recorta el backlog
# real de listen() al valor de net.core.somaxconn. Con flotas grandes y check-ins
# simultáneos, un somaxconn bajo (128 en kernels viejos) produce "connection refused"
# en picos. Este valor es un PISO: debe ser >= UWSGI_LISTEN_QUEUE (1024) y, como el
# task usa sysctl con valor absoluto, NO debe rebajar hosts ya bien configurados. Se fija
# en 4096 = default de Ubuntu moderno (kernel >= 5.4): en esos hosts el task es no-op, y en
# kernels viejos sube de verdad (128 -> 4096). Si subes UWSGI_LISTEN_QUEUE por encima de
# 4096, sube esto también. (Verificado en staging 2026-07-14: host ya en 4096 -> no-op.)
observer_api_somaxconn: 4096

# sslmode del cliente nats-api (Go/lib/pq) → PostgreSQL, leído por settings.DB_SSL en
# create_natsapi_conf. lib/pq solo soporta disable/require/verify-ca/verify-full (NO 'prefer').
# 'require' cifra sin verificar CA (correcto con el cert snakeoil del rol observer_db, ssl=on).
# Cierra el residual O-DIFF-PGAUTH (el default del comando era 'disable' = en plano).
# Solo afecta a nats-api; el cliente Django usa el default de libpq (prefer) por separado.
observer_db_sslmode: require

# Django source deployment (consumido por tasks/django_deploy.yml)
# observer_source_path: path del código fuente Django en el control node.
#   Default asume layout sibling: observer-rmm-dist/ y observer-rmm/ comparten parent dir.
#   Override en inventory si el layout es distinto o si se usa otra estrategia (git, etc).
# Post-consolidación F008: el dist es self-contained (D-03)
observer_source_path: "{{ playbook_dir }}/api/observerrmm/"
observer_django_requirements: "requirements.txt"

# Reporting (ee/reporting) — dashboards con gráficos (W005). Kaleido 1.x NO empaqueta
# chromium; genera los gráficos-imagen (SVG, obligatorio en PDF: WeasyPrint no ejecuta JS)
# lanzando un chromium del sistema. Con esto en true, plotly_get_chrome descarga un chromium
# versión-matcheada a la caché de Kaleido (bajo HOME={{ observer_root }}, el mismo HOME con
# que corren rmm/daphne/celery → autodescubierto al renderizar). Es una descarga externa
# (storage.googleapis.com) SOLO en provisión, análoga a Python/NATS. Poner en false para
# instalaciones mínimas: los reportes de texto/tabla y PDF-sin-gráfico funcionan sin chromium.
observer_reporting_charts_enabled: true

# Asistente IA — «Generar borrador con IA» del gestor de scripts (feature 032).
# Van acá, NO en group_vars, porque un ambiente/cliente tiene que poder cambiarlos
# desde su inventario (ver la nota de PRECEDENCIA en group_vars/observer_api/vars.yml).
# La credencial NO va acá: es la indirección al vault, en group_vars.
#
# El modelo por defecto se eligió midiendo, no por ficha técnica (2026-08-02):
# coding agent con 60,4 % en Terminal-Bench 2.1, 3/3 limpio sobre prompts reales de
# RMM, sin fences y sin gastar presupuesto en tokens de razonamiento.
observer_open_ai_base_url: "https://openrouter.ai/api/v1"
observer_open_ai_model: "poolside/laguna-s-2.1:free"
# 4000 está calibrado contra el `timeout=60` de core/views.py: medido, un prompt
# exigente consume 2.648 tokens en 55 s. Con 8000 el mismo prompt se fue a 158 s y la
# petición habría muerto en excepción. Subirlo NO da más margen, da más latencia.
observer_open_ai_max_tokens: 4000
# Vacío a propósito = el campo NO se manda al proveedor. Medido: fijarla no aporta
# determinismo (ni con 0.0) ni calidad, y mandarla es lo que rompió a kimi-k3 con
# HTTP 400. Vacío es la opción portable entre proveedores.
observer_open_ai_temperature: ""

# Zona horaria por defecto de la consola (CoreSettings.default_time_zone). Se aplica SOLO
# en la primera instalación (initial_db_setup --time-zone, al crear la fila): un deploy
# posterior no pisa el valor que el cliente cambie en Ajustes. Vacío = default del modelo
# (America/Santiago). La fija install.sh con la zona confirmada del cliente.
observer_default_time_zone: ""

# --- Firma de los certificados de borrado (053 · T017) ---------------------
# La clave ACTIVA la genera install.yml por ambiente y vive cifrada en
# group_vars/observer_api/vault_erase_signing.yml (gitignored), como
# vault_lost_mode_evidence_key. Acá solo van las RETIRADAS.
#
# Claves retiradas, en PEM PUBLICO. Rotar NO invalida lo ya firmado —una clave
# publica no caduca— pero SOLO si la saliente se publica acá: el verificador
# elige por el `key_id` que el propio certificado declara, y una clave que no
# esta publicada deja sin verificar todo lo que firmo.
#
# Rotar es RESPUESTA A INCIDENTE, no rutina: no hay CA ni certificado que venza,
# y la unica razon real para retirar una clave es que la privada se comprometa.
observer_erase_signing_keys_retired: []

# --- Despacho destructivo de Observer Erase (043 · ADR-029) -----------------
# Gate legal del Bloque A: con `false` la orden se gobierna (se crea, se confirma
# entre dos personas y vence su ventana) pero NO VIAJA al equipo; queda el evento
# `dispatch_gated_adr029` y nada mas.
#
# 🔑 El flag NO es el permiso para borrar: es el permiso para que la orden viaje.
# Lo que decide si se borra o solo se enumera es `dry_run` de la propia orden, y
# `dispatch_order` (erase/services.py:313) evalua este flag ANTES de mirarlo ⇒
# con el flag apagado TAMPOCO corre el simulacro en seco (RF-G05 / T023).
#
# Apagado de fabrica y en los 5 PROD. Se enciende por ambiente, aca y no a mano:
# local_settings.py se re-renderiza en cada install.yml.
observer_erase_destructive_dispatch_enabled: false
