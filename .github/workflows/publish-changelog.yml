---
# Valida que CHANGELOG.md genere el HTML del changelog público (scripts/build_changelog.py).
#
# NO publica: agents.observer.cl no es alcanzable desde los runners de GitHub (el firewall
# admite GitHub solo por FQDN y los runners salen de rangos Azure dinámicos). La
# publicación la hace deploy-api.yml desde el control-plane, en la play «Changelog
# público», cuando el inventario define observer_changelog_publish_host.

name: Changelog build

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - scripts/build_changelog.py
      - .github/workflows/publish-changelog.yml
  workflow_dispatch: {}

jobs:
  publish-changelog:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build changelog HTML
        run: python3 scripts/build_changelog.py CHANGELOG.md changelog.html
