---
# Valores por defecto — sobreescribir en group_vars/observer_db.yml

# PostgreSQL 15 explícito vía PGDG (estándar BrainCorp, igual que el install.sh
# upstream): NO se usa el postgres de la distribución.
observer_postgresql_version: "15"
observer_db_name: observerrmm
observer_db_user: observerrmm
observer_db_port: 5432
observer_db_max_connections: 500
observer_db_allowed_hosts:
  - "127.0.0.1/32"

observer_mesh_db_name: meshcentral
observer_mesh_db_user: meshcentral

pg_shared_buffers: "4GB"
pg_huge_pages: "try"
# HugePages: nr_hugepages se DERIVA de pg_shared_buffers (abajo) — elimina el acoplamiento
# manual que hacía que un default fijo (2100) no cupiera en VMs chicas. Fórmula: nº de páginas
# de 2 MiB que cubren shared_buffers + 5% de overhead (el segmento de mem compartida de PG es
# shared_buffers + wal_buffers/locks/etc.), redondeado hacia arriba. Coincide con el mapeo de
# prod (4GB→2151, 40GB→21504). Con huge_pages=try, si nr_hugepages no cubre shared_buffers PG
# ignora las hugepages en silencio; al derivar, ambas vars quedan SIEMPRE en sincronía aunque
# se cambie shared_buffers. Un override explícito (p.ej. staging pg_vm_nr_hugepages=0) gana.
# Cálculo EXACTO de PG (alternativa de mayor precisión): `postgres -C
# shared_memory_size_in_huge_pages -D <datadir>` (PG15+), pero requiere PG ya instalado/config.
# Método de reserva:
#   pg_hugepages_via_grub: true  → reserva en boot vía drop-in /etc/default/grub.d (robusto
#       para pools grandes, = prod). REQUIERE REBOOT para activarse (no se fuerza: el usuario
#       controla la infra). El sysctl sigue aplicándose como bootstrap del boot de instalación.
#   pg_hugepages_via_grub: false → solo sysctl runtime (ok para pools chicos; menos robusto a
#       escala tras reboots con RAM fragmentada).
pg_hugepages_via_grub: true
# Derivado de pg_shared_buffers: páginas de 2 MiB (2097152 B) + 5% overhead, ceil. Espera un
# valor con sufijo de unidad ("4GB"/"256MB"). Override explícito en inventory gana sobre esto.
pg_vm_nr_hugepages: "{{ (((pg_shared_buffers | human_to_bytes) / 2097152) * 1.05) | round(0, 'ceil') | int }}"
pg_work_mem: "16MB"
pg_maintenance_work_mem: "256MB"
pg_autovacuum_work_mem: "256MB"
pg_wal_buffers: "16MB"
pg_checkpoint_timeout: "15min"
pg_checkpoint_completion_target: "0.9"
pg_min_wal_size: "1GB"
pg_max_wal_size: "8GB"
pg_effective_cache_size: "12GB"
pg_random_page_cost: "1.1"
pg_effective_io_concurrency: 200
pg_max_parallel_workers_per_gather: 2
pg_max_parallel_workers: 4
pg_max_worker_processes: 8
pg_jit: "off"
pg_autovacuum_max_workers: 3
pg_autovacuum_naptime: "60s"
pg_autovacuum_vacuum_cost_delay: "2ms"
pg_log_min_duration_statement: 5000
pg_log_checkpoints: "on"
pg_log_lock_waits: "on"
pg_timezone: "America/Santiago"
pg_log_timezone: "America/Santiago"

# SSL — usa el cert snakeoil autogenerado por el paquete ssl-cert (dependencia de
# postgresql), local al host DB e INDEPENDIENTE de acme.sh/proxy. Cifra el tráfico DB
# cross-host (multi-host); en single-host loopback es inocuo. Self-signed: cifra sin
# autenticar la identidad del servidor. Override a un cert de CA si se desea verify-ca.
pg_ssl_cert_file: /etc/ssl/certs/ssl-cert-snakeoil.pem
pg_ssl_key_file: /etc/ssl/private/ssl-cert-snakeoil.key
