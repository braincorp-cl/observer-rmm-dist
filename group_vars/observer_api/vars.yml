---
# API layer — observer_api host

# Conexiones a servicios externos (resueltas dinámicamente por inventario)
observer_db_host: "{{ hostvars[groups['observer_db'][0]]['ansible_host'] | default('localhost') }}"
observer_db_name: observerrmm
observer_db_user: observerrmm
observer_db_port: 5432

observer_redis_host: "{{ hostvars[groups['observer_redis'][0]]['ansible_host'] | default('localhost') }}"
observer_redis_port: 6379

observer_mesh_host: "{{ hostvars[groups['observer_mesh'][0]]['ansible_host'] | default('localhost') }}"
observer_mesh_user: meshcentral_admin

observer_nats_host: "127.0.0.1"    # NATS corre en el mismo host que el API
observer_nats_port: 4222
observer_nats_ws_port: 9235

observer_nats_version: "2.14.0"
observer_python_version: "3.11"

celery_min_workers: 2
celery_max_workers: 20

# ============================================================
# Intervalos de check-in (segundos) — perfil FLOTA CHICA/MEDIA (baseline genérico)
# ============================================================
# Baseline para despliegues de flota chica/media: heartbeat responsivo (hello 30-60s)
# + colectores pesados relajados (sw/hw inventory 1-2h) para no cargar la DB de más.
# Para flotas MUY grandes (decenas de miles de agentes) subir agentinfo/disks/inventory
# (menos frecuencia) overrideando estos valores en el inventario del ambiente.
# Regla dura: SYNCMESH >= 3600 (piso anti-OOM, RN-030). Los 8 CHECKIN_* + jitter + NATS
# max conn se parametrizan completos (F009); nombres = los que lee apiv3/utils.py.
observer_checkin_hello_min: 30
observer_checkin_hello_max: 60
observer_checkin_agentinfo_min: 300
observer_checkin_agentinfo_max: 600
observer_checkin_win_services_min: 2400
observer_checkin_win_services_max: 3000
observer_checkin_pubip_min: 600
observer_checkin_pubip_max: 900
observer_checkin_disks_min: 1000
observer_checkin_disks_max: 2000
observer_checkin_sw_inventory_min: 3600
observer_checkin_sw_inventory_max: 7200
observer_checkin_hw_assets_min: 3600
observer_checkin_hw_assets_max: 7200
observer_checkin_syncmesh_min: 3600
observer_checkin_syncmesh_max: 7200
observer_check_interval_jitter_min: 3
observer_check_interval_jitter_max: 120
observer_nats_max_connections: 50000

# Geolocalización (feature 023) e intervalos por ambiente — NO declarar acá.
#
# ⚠️ PRECEDENCIA: este archivo es group_vars/ DEL PLAYBOOK, y le GANA a las vars de
# grupo del inventario (`all: vars:` en inventory/<ambiente>.yml). Toda variable que un
# ambiente deba poder sobrescribir tiene que vivir SÓLO en roles/observer_api/defaults/
# (la precedencia más baja de todas), nunca acá — si se declara en los dos lados el
# inventario queda decorativo y el override se pierde EN SILENCIO.
#
# Pasó de verdad (2026-07-27): observer_checkin_geo_min/max estaban declarados acá en
# 1500/2100 con un comentario que decía "bajarlo en el inventario del ambiente (staging
# usa 300/300)" — instrucción que este mismo archivo hacía imposible de cumplir. No se
# notó por meses porque local_settings.py estaba parchado a mano en el servidor y nunca
# se re-renderizaba; al re-renderizarlo por fin, staging perdió su cadencia de 300 s.
# Lo mismo iba a pasar con observer_latest_agent_ver.
#
# Sus defaults viven en roles/observer_api/defaults/main.yml:
#   observer_checkin_geo_min / observer_checkin_geo_max  (1500 / 2100)
#   observer_latest_agent_ver                            ("" = manda settings.py)

# Key de Google Geolocation (features 023/026) — SERVER-SIDE, jamás en git ni en la
# flota. Se define en el vault del ambiente como vault_google_geolocation_api_key.
# Vacía = resolución WiFi apagada y el agente degrada a IP (no rompe nada).
# Ésta SÍ va acá: no es un valor por ambiente sino la indirección al vault, y ningún
# inventario la sobrescribe (el que cambia es el vault).
observer_google_geolocation_api_key: "{{ vault_google_geolocation_api_key | default('') }}"

# Key del proveedor LLM del Asistente IA (feature 032). Misma lógica que la de Google:
# es la indirección al vault, no un valor por ambiente, así que SÍ va acá.
# Vacía = no se siembra nada y el botón «Generar borrador con IA» no aparece.
#
# ⚠️ Es una key DE CORTESÍA, compartida por todos los despliegues: existe para que el
# cliente pueda probar la generación de borradores. En cuanto el cliente pone la suya
# en Configuración global → Asistente IA, el deploy deja de tocar el bloque entero
# (ver la regla de no-pisado en core/management/commands/seed_ai_assistant.py).
observer_open_ai_token: "{{ vault_observer_open_ai_token | default('') }}"
