---
- name: systemd daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
  listen: systemd daemon-reload

- name: restart rmm
  ansible.builtin.systemd:
    name: rmm
    state: restarted
  listen: restart rmm

- name: restart daphne
  ansible.builtin.systemd:
    name: daphne
    state: restarted
  listen: restart daphne

- name: restart celery
  ansible.builtin.systemd:
    name: celery
    state: restarted
  listen: restart celery

- name: restart celerybeat
  ansible.builtin.systemd:
    name: celerybeat
    state: restarted
  listen: restart celerybeat

# Orden importa: nats (servidor) ANTES de nats-api (cliente). Los handlers corren en
# orden de definición al final del play, así el servidor ya tiene el config fresco
# (nats-rmm.conf regenerado por reload_nats) cuando nats-api reconecta — si no, el
# cliente choca con "nats: Authorization Violation" por token desincronizado.
- name: restart nats
  ansible.builtin.systemd:
    name: nats
    state: restarted
  listen: restart nats

- name: restart nats-api
  ansible.builtin.systemd:
    name: nats-api
    state: restarted
  listen: restart nats-api
