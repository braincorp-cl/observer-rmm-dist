# agents.observer.cl — CDN propio de binarios del agente Observer RMM.
#
# Solucion definitiva R-03 (faceta CDN): sirve los binarios del agente desde
# infra propia (appserver 10.20.0.52, Apache) en vez de github.com/.../releases.
# TLS lo termina el NPM corporativo aguas arriba; este backend sirve HTTP plano en :83.
#
# LECTURA (publica, sin auth) — dos rutas hacia el mismo archivo (unsigned, ADR-018):
#   (a) estatica, espejo del path de GitHub — la usa get_agent_url (rama sin token):
#       GET /releases/download/v{ver}/observeragent-v{ver}-{plat}-{arch}[.exe]
#   (b) API por query params (compatibilidad con el CDN de agentes upstream) — la usara
#       get_agent_url cuando exista un CodeSignToken (settings.AGENTS_URL):
#       GET /api/v2/agents/?version={ver}&arch={arch}&plat={plat}&token=...&api=...
#
# ESCRITURA (WebDAV, autenticada Basic sobre TLS) — la usa el job publish-cdn del
# release.yml del agente para PUBLICAR EN CADA RELEASE (push desde GitHub Actions):
#   MKCOL /releases/download/v{ver}/
#   PUT   /releases/download/v{ver}/observeragent-...
# Credencial en /etc/apache2/observer-agents-cdn.htpasswd (bcrypt); el valor plano vive
# como secret del repo observer-agent-dist (CDN_UPLOAD_USER / CDN_UPLOAD_PASSWORD).
#
# La autorizacion se define METODO POR METODO dentro de un unico <Directory> para evitar
# ambiguedad de merge entre contenedores. Ver scripts/appserver/README.md.
Listen 83

<VirtualHost *:83>
    ServerName agents.observer.cl
    ServerAdmin soporte@observer.cl

    DocumentRoot /var/www/html/observer-agents

    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.0.0.0/8

    RewriteEngine On

    # --- Ruta de lectura (b): API por query params -> archivo estatico (reescritura
    # interna). Captura version/arch/plat (orden-independiente) en env vars. El token
    # se ignora a proposito: binarios unsigned.
    RewriteCond %{QUERY_STRING} (?:^|&)version=([^&]+)
    RewriteRule .* - [E=AGV:%1]
    RewriteCond %{QUERY_STRING} (?:^|&)arch=([^&]+)
    RewriteRule .* - [E=AGA:%1]
    RewriteCond %{QUERY_STRING} (?:^|&)plat=([^&]+)
    RewriteRule .* - [E=AGP:%1]

    # windows -> sufijo .exe
    RewriteCond %{ENV:AGP} =windows
    RewriteRule "^/api/v2/agents/?$" "/releases/download/v%{ENV:AGV}/observeragent-v%{ENV:AGV}-windows-%{ENV:AGA}.exe?" [L]
    # linux/darwin -> sin extension (solo si se resolvio la version)
    RewriteCond %{ENV:AGV} !=""
    RewriteRule "^/api/v2/agents/?$" "/releases/download/v%{ENV:AGV}/observeragent-v%{ENV:AGV}-%{ENV:AGP}-%{ENV:AGA}?" [L]

    <Directory /var/www/html/observer-agents>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        DAV On
        AuthType Basic
        AuthName "Observer Agents CDN Upload"
        AuthUserFile /etc/apache2/observer-agents-cdn.htpasswd

        # Escritura: solo PUT/MKCOL, y siempre autenticada.
        <Limit PUT MKCOL>
            Require valid-user
        </Limit>
        # Lectura publica: solo binarios observeragent-v*; sin listado de directorios.
        # Se autoriza por REQUEST_FILENAME (archivo resuelto) para cubrir tanto la ruta
        # estatica como la /api/v2/agents/ reescrita internamente (REQUEST_URI conservaria
        # el original /api/v2/agents/ y no matchearia).
        <Limit GET HEAD>
            Require expr "%{REQUEST_FILENAME} =~ m#/observeragent-v[0-9][^/]*$#"
        </Limit>
        # Cualquier otro metodo (PROPFIND/DELETE/MOVE/COPY/OPTIONS/...): denegado.
        <LimitExcept GET HEAD PUT MKCOL>
            Require all denied
        </LimitExcept>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/agents.observer.cl-error.log
    CustomLog ${APACHE_LOG_DIR}/agents.observer.cl-access.log vhost_combined
</VirtualHost>
