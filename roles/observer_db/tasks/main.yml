---
# 1. Huge Pages — debe reservarse ANTES de iniciar PostgreSQL.
# Bootstrap inmediato del boot de instalación vía sysctl (evita forzar reboot a mitad del
# play). Si pg_hugepages_via_grub está activo, grub es la fuente robusta tras el próximo boot.
- name: Reservar HugePages vía sysctl (bootstrap del boot actual)
  ansible.posix.sysctl:
    name: vm.nr_hugepages
    value: "{{ pg_vm_nr_hugepages }}"
    sysctl_file: /etc/sysctl.d/60-observer-hugepages.conf
    reload: true
    state: present

# Reserva persistente en boot vía grub (método de prod, robusto para pools grandes: el kernel
# las aparta antes de cualquier userspace, sin depender de RAM contigua en runtime). Drop-in
# en /etc/default/grub.d que grub-mkconfig sourcea tras /etc/default/grub → appendea
# `hugepages=` sin clobberear otros args. REQUIERE REBOOT (no se fuerza: el usuario controla
# la infra; el sysctl de arriba cubre el boot de instalación).
- name: Asegurar /etc/default/grub.d (drop-ins de grub)
  ansible.builtin.file:
    path: /etc/default/grub.d
    state: directory
    mode: "0755"
  when: pg_hugepages_via_grub | bool

- name: Reservar HugePages en grub (boot-time, robusto para pools grandes)
  ansible.builtin.template:
    src: grub-hugepages.cfg.j2
    dest: /etc/default/grub.d/99-observer-hugepages.cfg
    owner: root
    group: root
    mode: "0644"
  when: pg_hugepages_via_grub | bool
  register: pg_grub_hugepages
  notify: update grub

- name: Quitar el drop-in de grub si se desactiva el método grub
  ansible.builtin.file:
    path: /etc/default/grub.d/99-observer-hugepages.cfg
    state: absent
  when: not (pg_hugepages_via_grub | bool)
  notify: update grub

- name: Avisar que la reserva grub de HugePages requiere reboot
  ansible.builtin.debug:
    msg: >-
      HugePages fijadas en grub (hugepages={{ pg_vm_nr_hugepages }}). REINICIE el host de la DB
      para activar la reserva en boot; hasta el reboot rige el sysctl (best-effort sobre la RAM
      disponible). Recuerde mantener pg_vm_nr_hugepages en sincronía con pg_shared_buffers.
  when: pg_grub_hugepages.changed | default(false)

# 2. Repositorio oficial PostgreSQL (PGDG) — get_url + signed-by, fiel a install.sh
#    (F009 D-04: reemplaza apt_key deprecado; sin apt_repository ni deb822_repository)
- name: Crear directorio de keyrings APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Descargar clave GPG PostgreSQL (PGDG)
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/pgdg.asc
    mode: "0644"

- name: Registrar repositorio PostgreSQL con signed-by
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pgdg.list
    content: "deb [signed-by=/etc/apt/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main\n"
    owner: root
    group: root
    mode: "0644"

# 3. Instalar PostgreSQL
- name: Instalar PostgreSQL {{ observer_postgresql_version }}
  ansible.builtin.apt:
    name:
      - "postgresql-{{ observer_postgresql_version }}"
      - python3-psycopg2
      # ssl-cert: genera el snakeoil (/etc/ssl/certs/ssl-cert-snakeoil.*) que usa ssl=on.
      # Es dependencia de postgresql, pero se declara explícito por robustez.
      - ssl-cert
    state: present
    update_cache: true

# 4. Configuración tuning — ANTES de asegurar el arranque, para que el servicio
# siempre inicie con el config correcto. Si el config en disco es inválido (p.ej.
# shared_buffers > RAM), "iniciar" fallaría antes de poder corregirlo.
- name: Desplegar postgresql.conf con tuning de producción
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "/etc/postgresql/{{ observer_postgresql_version }}/main/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: restart postgresql

# 5. pg_hba.conf — acceso remoto desde observer_api y observer_mesh
- name: Desplegar pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ observer_postgresql_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: reload postgresql

- name: Asegurar servicio PostgreSQL iniciado
  ansible.builtin.systemd:
    name: "postgresql@{{ observer_postgresql_version }}-main"
    state: started
    enabled: true

# 6. Bases de datos y usuarios
- name: Crear usuario PostgreSQL para Django
  community.postgresql.postgresql_user:
    name: "{{ observer_db_user }}"
    password: "{{ vault_observer_db_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEROLE,NOCREATEDB
    state: present
  become: true
  become_user: postgres

- name: Crear base de datos observerrmm
  community.postgresql.postgresql_db:
    name: "{{ observer_db_name }}"
    owner: "{{ observer_db_user }}"
    encoding: UTF8
    # C.UTF-8 como el servidor TacticalRMM de referencia (verificado en
    # producción real 2026-06-10: lc_collate=C.UTF-8); disponible en Ubuntu
    # minimizado sin el paquete locales
    lc_collate: "C.UTF-8"
    lc_ctype: "C.UTF-8"
    template: template0
    state: present
  become: true
  become_user: postgres

- name: Crear usuario PostgreSQL para MeshCentral
  community.postgresql.postgresql_user:
    name: "{{ observer_mesh_db_user }}"
    password: "{{ vault_observer_mesh_db_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEROLE,NOCREATEDB
    state: present
  become: true
  become_user: postgres

- name: Crear base de datos meshcentral
  community.postgresql.postgresql_db:
    name: "{{ observer_mesh_db_name }}"
    owner: "{{ observer_mesh_db_user }}"
    encoding: UTF8
    lc_collate: "C.UTF-8"
    lc_ctype: "C.UTF-8"
    template: template0
    state: present
  become: true
  become_user: postgres
