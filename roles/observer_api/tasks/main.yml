---
# Kernel tuning (backport v1.5.1 B2): la cola de escucha de uWSGI (`listen` en app.ini,
# default 1024) queda recortada por net.core.somaxconn. Subirla persiste en
# /etc/sysctl.d/ y se aplica al vuelo (reload), sin reboot. Debe correr antes de arrancar
# el servicio rmm (uWSGI). Espejo del patrón sysctl usado en observer_db (HugePages).
- name: Subir net.core.somaxconn para la cola de escucha de uWSGI
  ansible.posix.sysctl:
    name: net.core.somaxconn
    value: "{{ observer_api_somaxconn }}"
    sysctl_file: /etc/sysctl.d/60-observer-somaxconn.conf
    reload: true
    state: present

# Python 3.11.8 compilado desde fuente — método del install.sh original.
# Reemplaza el PPA deadsnakes (no oficial): ver roles/observer_python.
- name: Instalar Python desde fuente (método install.sh)
  ansible.builtin.include_role:
    name: observer_python

# Librerías de sistema para WeasyPrint (ee/reporting genera PDFs) —
# espejo del install.sh líneas 549-552 (rama ubuntu)
- name: Instalar dependencias de sistema de WeasyPrint
  ansible.builtin.apt:
    name:
      - libpango-1.0-0
      - libharfbuzz0b
      - libpangoft2-1.0-0
    state: present
    update_cache: true

# Directorios
- name: Crear directorios del API
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ observer_user }}"
    group: "{{ observer_group }}"
    mode: "0755"
  loop:
    - "{{ observer_root }}/api"
    - "{{ observer_root }}/api/{{ observer_app_name }}"
    # Paquete Django interno (observerrmm/observerrmm/): local_settings.py se despliega
    # acá ANTES del sync de código (django_deploy.yml). En greenfield este dir aún no
    # existe → el deploy de local_settings falla. Lo creamos explícitamente; el sync
    # posterior (sin --delete) rellena el resto sin pisar local_settings.py.
    - "{{ observer_root }}/api/{{ observer_app_name }}/{{ observer_app_name }}"
    - "{{ observer_root }}/backups"
    # /var/log/celery debe existir y ser de observer ANTES de arrancar celery:
    # celery multi (como user observer) hace os.makedirs('/var/log/celery') y, si
    # no existe, falla con PermissionError bajo /var/log -> crash-loop del servicio.
    # (= install.sh líneas 383-384: mkdir -p /var/log/celery + chown al user de servicio.)
    - /var/log/celery
    # Reporting (ee/reporting): assets + schemas (= install.sh líneas 559-561).
    - "{{ observer_root }}/reporting/assets"
    - "{{ observer_root }}/reporting/schemas"

# Virtualenv
- name: Crear virtualenv Python {{ observer_python_version }}
  ansible.builtin.command:
    cmd: "python{{ observer_python_version }} -m venv {{ observer_root }}/api/env"
    creates: "{{ observer_root }}/api/env/bin/activate"
  become: true
  become_user: "{{ observer_user }}"

# uWSGI e uvicorn
- name: Instalar uWSGI y uvicorn en el venv
  ansible.builtin.pip:
    name:
      - uwsgi
      - uvicorn
      - setuptools==80.9.0
      - wheel==0.45.1
    virtualenv: "{{ observer_root }}/api/env"
    state: present
  become: true
  become_user: "{{ observer_user }}"

# Configuración Django — DEBE ir en el paquete interno (junto a settings.py): settings.py
# hace `from .local_settings import *` (import relativo = observerrmm.local_settings). El dir
# externo {{ observer_app_name }}/ tiene manage.py; el paquete está en
# {{ observer_app_name }}/{{ observer_app_name }}/. Si se deja afuera, el import falla,
# suppress(ImportError) lo traga y ALLOWED_HOSTS queda [] -> IndexError en settings.py:170.
- name: Desplegar local_settings.py
  ansible.builtin.template:
    src: local_settings.j2
    dest: "{{ observer_root }}/api/{{ observer_app_name }}/{{ observer_app_name }}/local_settings.py"
    owner: "{{ observer_user }}"
    group: "{{ observer_group }}"
    mode: "0640"
  notify:
    - restart rmm
    - restart daphne
    - restart celery
    - restart celerybeat

# NATS Server — instalar el binario ANTES del setup de Django: reload_nats (dentro de
# django_deploy) ejecuta `nats-server -signal reload`; si el binario no existe,
# subprocess.run lanza FileNotFoundError y revienta el deploy. El install.sh instala
# nats-server antes del setup de Django por esta razón. (El servicio se arranca al final;
# aquí solo se descarga el binario, así que no necesita aún el nats-rmm.conf.)
- name: Instalar NATS Server {{ observer_nats_version }}
  ansible.builtin.include_tasks: nats.yml

# Django setup — sync código + pip + migrate + collectstatic + reload_nats (R-04)
- name: Setup Django (código + dependencias + migrate + collectstatic + reload_nats)
  ansible.builtin.include_tasks: django_deploy.yml

# Reporting (ee/reporting) — chromium para Kaleido (W005). Los reportes con gráficos en
# formato "image" (SVG; obligatorio en PDF porque WeasyPrint no ejecuta JS) usan Kaleido,
# que desde 1.x ya NO empaqueta su propio chromium: lo lanza del sistema. plotly.io.get_chrome()
# descarga un chromium versión-matcheada a la caché de Kaleido, que Kaleido autodescubre al
# renderizar bajo $HOME/.local/share/choreographer/. HOME debe fijarse al HOME REAL del usuario
# de servicio (el de passwd, p.ej. /home/observer) — NO {{ observer_root }}: las unidades systemd
# (daphne/celery/celerybeat/rmm) NO setean Environment=HOME, así que systemd lo deriva del passwd
# de User={{ observer_user }}. Si se provisiona con otro HOME, la caché queda donde los servicios
# no la buscan y el render falla con "Kaleido requires Google Chrome". DEBE correr DESPUÉS de
# django_deploy (que instala plotly/kaleido en el venv). Idempotente y auto-sanador: chequea el
# binario en el HOME de servicio (un cambio de HOME re-provisiona sin borrar marcador aparte).
- name: Provisionar chromium para Kaleido (reportes con gráficos)
  when: observer_reporting_charts_enabled | bool
  block:
    # HOME real del usuario de servicio (índice 4 de la entrada passwd): a ese $HOME
    # apuntan daphne/celery/rmm en runtime, así que la caché de Kaleido debe vivir ahí.
    - name: Resolver el HOME real del usuario de servicio (passwd)
      ansible.builtin.getent:
        database: passwd
        key: "{{ observer_user }}"

    - name: Fijar observer_service_home desde passwd
      ansible.builtin.set_fact:
        observer_service_home: "{{ ansible_facts.getent_passwd[observer_user][4] }}"

    # Idempotencia auto-sanadora: se chequea el binario en el HOME de servicio (donde los
    # servicios lo autodescubren), NO un marcador desacoplado — si el HOME cambia o la caché
    # quedó en el lugar equivocado, se re-provisiona. Ruta estable en Kaleido 1.x/choreographer.
    #
    # ESTE CHEQUEO VA PRIMERO A PROPÓSITO, y el orden importa más de lo que parece. Antes el
    # `apt` de abajo corría SIEMPRE, incluso con chromium ya provisionado, y con `update_cache`
    # ⇒ cada deploy golpeaba los repos apt del servidor, entre ellos los de TERCEROS. El
    # 2026-07-27 una caída transitoria de deb.nodesource.com (403 del origen S3, ~30 min) abortó
    # así un `deploy-api.yml` que sólo cambiaba un modelo Django: el bloque no tenía nada que
    # hacer —el binario estaba desde el 16-07— y aun así tumbó el playbook DESPUÉS del rsync y
    # ANTES del migrate, dejando el servidor con código nuevo, sin migrar y sin reiniciar.
    # Chequear primero hace que el caso normal (ya provisionado) no toque la red de nadie.
    - name: Verificar si el chromium de Kaleido ya está en el HOME de servicio
      ansible.builtin.stat:
        path: "{{ observer_service_home }}/.local/share/choreographer/deps/chrome-linux64/chrome"
      register: observer_kaleido_chrome_bin

    # El chromium que baja plotly.io.get_chrome() es solo el binario: en un servidor mínimo
    # NO arranca por falta de sus librerías de sistema (BrowserFailedError). Espejo del patrón
    # de WeasyPrint (arriba). Lista derivada de `ldd chrome | grep "not found"` en Ubuntu 22.04.
    #
    # Va condicionado al mismo `stat` que la descarga. CONTRAPARTIDA ASUMIDA: si alguien borra
    # estas librerías pero deja el binario, el deploy ya no las repone y el render fallaría con
    # BrowserFailedError. Se acepta porque la presencia del binario es exactamente la señal en
    # la que la descarga ya confiaba, y la salida es la misma que para cualquier otro problema
    # de la caché: borrar el binario y volver a correr, que re-provisiona ambas cosas.
    - name: Instalar dependencias de sistema de chromium (Kaleido)
      ansible.builtin.apt:
        name:
          - libxcomposite1
          - libxdamage1
          - libxfixes3
          - libxrandr2
          - libasound2
          - libatk1.0-0
          - libatk-bridge2.0-0
          - libatspi2.0-0
          - libcairo2
          - libcups2
          - libgbm1
          - libxkbcommon0
          - fonts-liberation
        state: present
        update_cache: true
      when: not observer_kaleido_chrome_bin.stat.exists

    - name: Descargar chromium para Kaleido (plotly.io.get_chrome)
      ansible.builtin.command:
        cmd: >-
          {{ observer_root }}/api/env/bin/python -c
          "import plotly.io as pio; pio.get_chrome()"
      become: true
      become_user: "{{ observer_user }}"
      environment:
        HOME: "{{ observer_service_home }}"
      register: observer_kaleido_chrome_install
      changed_when: observer_kaleido_chrome_install.rc == 0
      when: not observer_kaleido_chrome_bin.stat.exists

  # NO FATAL a propósito (2026-07-27). Cuando chromium ya está, el `stat` de arriba evita
  # tocar la red; pero cuando NO está —instalación nueva, o caché borrada— el `apt` y la
  # descarga sí corren, y antes cualquier tropiezo de ahí abortaba TODO el rol: se caía la
  # instalación entera por una capacidad opcional. La desproporción es el punto: chromium
  # acá sirve sólo para los gráficos en imagen de los reportes, y el propio rol ya contempla
  # operar sin él (ver el aviso de observer_reporting_charts_enabled=false más abajo).
  # Peor aún en deploy-api.yml, donde reventaba DESPUÉS del rsync y ANTES del migrate.
  rescue:
    - name: Avisar que la provisión de chromium falló, sin abortar
      ansible.builtin.debug:
        msg: >-
          ⚠️ No se pudo provisionar chromium para Kaleido; el resto del despliegue continúa.
          Los reportes de texto/tabla y los PDF sin gráficos funcionan igual; los que llevan
          gráficos en imagen fallarán con "Kaleido requires Google Chrome". Causa habitual:
          un repo apt inalcanzable. Para reintentar, volver a correr el playbook cuando la
          red esté sana — es idempotente y sólo re-provisiona si falta el binario.

- name: Aviso si no se provisiona chromium para gráficos de reportes
  ansible.builtin.debug:
    msg: >
      observer_reporting_charts_enabled=false — se omite la provisión de chromium para
      Kaleido. Los reportes de texto/tabla y los PDF sin gráficos funcionan igual; los
      dashboards con gráficos (formato image/SVG y HTML interactivo) requieren habilitarlo.
  when: not (observer_reporting_charts_enabled | bool)

# nats-api binary (Go). Debe estar recompilado desde el fuente actual (natsapi/svc.go
# conecta como user NATS `observerrmm`); un binario stale pre-rebrand conecta con el
# user viejo y choca con "nats: Authorization Violation". Al cambiar, reiniciar el servicio.
- name: Copiar nats-api binary
  ansible.builtin.copy:
    src: "nats-api{{ '-arm64' if ansible_facts['architecture'] == 'aarch64' else '' }}"
    dest: /usr/local/bin/nats-api
    owner: root
    group: root
    mode: "0755"
  notify: restart nats-api

# Celery conf
- name: Crear directorio /etc/conf.d
  ansible.builtin.file:
    path: /etc/conf.d
    state: directory
    mode: "0755"

- name: Desplegar celery.conf
  ansible.builtin.template:
    src: celery.conf.j2
    dest: /etc/conf.d/celery.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - restart celery
    - restart celerybeat

# Systemd services
- name: Desplegar servicios systemd del API
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: rmm.service.j2, dest: rmm.service }
    - { src: daphne.service.j2, dest: daphne.service }
    - { src: nats.service.j2, dest: nats.service }
    - { src: nats-api.service.j2, dest: nats-api.service }
    - { src: celery.service.j2, dest: celery.service }
    - { src: celerybeat.service.j2, dest: celerybeat.service }
  notify: systemd daemon-reload

- name: Habilitar y arrancar servicios del API
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - nats
    - nats-api
    - rmm
    - daphne
    - celery
    - celerybeat
