name: No legacy upstream strings

# Gate F008/T019 (D-07 / RN-05) - previene regresiones del rebrand hacia
# Observer RMM en el repo consolidado (backend + frontend + infra).
#
# ALCANCE (ampliado el 2026-08-03): cubre TODO el arbol, incluido 'web/'.
# Antes 'web/' se excluia delegando en el gate propio del repo observer-rmm-web,
# pero ese repo quedo muerto y el frontend vivo es 'web/app/' de ESTE repo. Su
# workflow anidado (web/app/.github/workflows/) NO corria: GitHub Actions solo
# lee .github/workflows/ de la RAIZ del repositorio. O sea que el frontend
# estaba sin gate mientras aparentaba tener uno. Se elimino ese archivo inerte y
# su cobertura se absorbio aca.
#
# PATRONES (3 familias):
#   1. Producto legacy: 'tactical' como token (seguido de no-letra o fin) + las
#      formas pegadas tacticalrmm/tacticalagent/tacticalmesh.
#   2. Proveedor upstream: 'amidaware'.
#   3. Prefijo 'trmm': nombraba al producto legacy y se migro a 'ORMM_'/'ormm'
#      (constantes de settings, logger, claves JSON, acciones websocket, assets
#      y la columna sync_mesh_with_ormm). Ver la migracion core/0060.
# grep -i => cubre Tactical/TACTICAL/Trmm/TRMM/AmidaWare.
#
# El guard ([^a-z]) evita que 'tactical' pegado a otra palabra dispare; 'trmm'
# va sin guard porque no es prefijo de ninguna palabra legitima del arbol
# ('observerrmm' NO lo contiene).
#
# Exclusiones por dir: migrations (historia Django congelada - la columna se
#   renombro con un RenameField nuevo, NO editando 0043), test_data (fixtures),
#   docs (PROVENANCE.md documenta el linaje a proposito), y los caches y
#   artefactos de build habituales. Exclusion por archivo: CHANGELOG.md en
#   cualquier nivel — un changelog NARRA el rebrand ("se renombro X -> Y"), asi
#   que nombrar el string legacy ahi es su funcion, no una regresion.
#
# Exclusiones de linea: NINGUNA con objeto hoy. Solo queda la del propio archivo
# de este workflow, que necesita nombrar los strings que prohibe.
#
# Historia, para que nadie las reponga "por si acaso": hubo 6 excepciones de
# comentarios de procedencia, resueltas redactandolos sin nombrar al producto
# legacy. La ultima fue composables/scripts.ts, que abria el repo publico de
# scripts de un tercero para ver el codigo de un script — un link real, no
# branding, con la decision de que repo usar todavia abierta.
#
# Esa decision se cerro con ADR-026: los scripts son propiedad del producto y
# viven en api/observerrmm/scripts/library/, asi que el link se elimino y la
# excepcion quedo protegiendo NADA. Una excepcion vencida no es inofensiva: deja
# un agujero silencioso por el que la misma URL puede volver sin que el gate
# diga una palabra. Verificado antes de sacarla: 0 hits sin ella.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  no-legacy:
    runs-on: ubuntu-latest
    name: Block legacy upstream strings
    steps:
      - uses: actions/checkout@v4

      - name: Scan for legacy strings
        run: |
          set -uo pipefail

          # Ver cabecera para el detalle de las 3 familias.
          PATTERN='tacticalrmm|tacticalagent|tacticalmesh|tactical([^a-z]|$)|amidaware|trmm'

          # Prefijo '\.?/?' tolera greps que emiten o no './' al escanear '.'
          HITS=$(grep -rniE "$PATTERN" \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=__pycache__ \
            --exclude-dir=.pytest_cache \
            --exclude-dir=.mypy_cache \
            --exclude-dir=migrations \
            --exclude-dir=test_data \
            --exclude-dir=docs \
            --exclude-dir=smoke-results \
            --exclude=CHANGELOG.md \
            . \
            | grep -vE '^\.?/?\.github/workflows/no-legacy-strings\.yml:' \
            || true)

          # Los NOMBRES de archivo tambien cuentan: un `grep -r` mira contenidos,
          # asi que un modulo llamado sync_mesh_with_<legacy>.py pasaba verde con
          # su interior ya migrado. Paso exactamente eso el 2026-08-03.
          PATHS=$(git ls-files \
            | grep -viE '(^|/)(migrations|test_data|docs|smoke-results)/' \
            | grep -iE "$PATTERN" \
            || true)

          if [ -n "$HITS" ] || [ -n "$PATHS" ]; then
            echo "::error::Legacy upstream strings detected outside the documented allowlist."
            if [ -n "$HITS" ]; then echo ""; echo "Hits (contenido):"; echo "$HITS"; fi
            if [ -n "$PATHS" ]; then echo ""; echo "Hits (nombre de archivo):"; echo "$PATHS"; fi
            exit 1
          fi

          echo "::notice::No new legacy upstream strings detected."
