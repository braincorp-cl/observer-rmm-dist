---
# django_deploy.yml — despliegue del código Django + setup inicial
#
# Cubre los pasos faltantes entre "Desplegar local_settings.py" y "Instalar
# NATS Server" del role observer_api: sincronizar el código fuente, instalar
# dependencias Python, correr migraciones de BD, recolectar estáticos y
# generar `nats-rmm.conf` con el user `observerrmm` (cierre cross-repo R-04).
#
# Idempotencia: synchronize usa rsync delta-transfer; pip install respeta
# requirements; migrate/collectstatic/reload_nats son no-op si ya están al día.
#
# Precondición: el control node debe tener el código del hub en
# {{ observer_source_path }} (default: {{ playbook_dir }}/api/observerrmm/ — dist-interno desde F008/D-03;
# relativo a playbook_dir).

- name: Validar que el path del código fuente Django existe en el control node
  ansible.builtin.stat:
    path: "{{ observer_source_path }}"
  delegate_to: localhost
  become: false
  register: observer_source_stat

- name: Fallar si el código fuente no existe
  ansible.builtin.fail:
    msg: >
      No se encontró el código fuente Django en {{ observer_source_path }}.
      Configure `observer_source_path` apuntando al directorio
      api/observerrmm/ del repo observer-rmm en el control node.
  when: not observer_source_stat.stat.exists

- name: Sincronizar código fuente Django al host
  ansible.posix.synchronize:
    src: "{{ observer_source_path }}"
    dest: "{{ observer_root }}/api/{{ observer_app_name }}/"
    delete: false
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.pytest_cache"
      - "--exclude=local_settings.py"
      - "--exclude=nats-rmm.conf"
      - "--exclude=.env"
  become: true
  become_user: "{{ observer_user }}"
  notify:
    - restart rmm
    - restart daphne
    - restart celery
    - restart celerybeat

- name: Instalar dependencias Python (requirements.txt)
  ansible.builtin.pip:
    requirements: "{{ observer_root }}/api/{{ observer_app_name }}/{{ observer_django_requirements }}"
    virtualenv: "{{ observer_root }}/api/env"
    state: present
  become: true
  become_user: "{{ observer_user }}"
  notify:
    - restart rmm
    - restart daphne
    - restart celery

- name: Ejecutar Django migrate
  ansible.builtin.command:
    cmd: "{{ observer_root }}/api/env/bin/python manage.py migrate --noinput"
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
  register: django_migrate_result
  changed_when: "'No migrations to apply' not in django_migrate_result.stdout"

- name: Ejecutar Django collectstatic
  ansible.builtin.command:
    cmd: "{{ observer_root }}/api/env/bin/python manage.py collectstatic --noinput"
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
  register: django_collectstatic_result
  changed_when: "'0 static files copied' not in django_collectstatic_result.stdout"

# Secuencia de setup de Django que el install.sh corre tras collectstatic
# (install.sh líneas 571-576). El rol la omitía y por eso:
#   - create_uwsgi_conf NO generaba app.ini -> rmm.service (uwsgi --ini app.ini) crash-loop
#   - create_natsapi_conf NO generaba nats-api.conf -> nats-api crash-loop ("unexpected end of JSON input")
# generate_json_schemas (reporting), load_chocos (Chocolatey) y load_community_scripts
# cargan datos funcionales. create_* escriben en settings.BASE_DIR (el dir del paquete).
- name: Comandos de setup Django (schemas, nats-api.conf, app.ini, chocos, community scripts)
  ansible.builtin.command:
    cmd: "{{ observer_root }}/api/env/bin/python manage.py {{ item }}"
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
  loop:
    - generate_json_schemas
    - create_natsapi_conf
    - create_uwsgi_conf
    - load_chocos
  changed_when: true
  notify:
    - restart rmm
    - restart daphne

# Community scripts (= install.sh L391-394): el repo se clona a settings.SCRIPTS_DIR
# (= /opt/trmm-community-scripts, ruta legacy en settings.py) y load_community_scripts
# lo carga. Es un RECURSO EXTERNO — decisión BrainCorp pendiente sobre qué repo usar
# (upstream amidaware/community-scripts o un fork braincorp-cl) → O-COMMUNITY-SCRIPTS,
# análogo a R-03 (CDN). OPT-IN: si observer_community_scripts_repo no se define, se omite
# sin bloquear el deploy (el dashboard funciona sin la librería de scripts comunitarios).
- name: Provisionar community scripts (opt-in — requiere observer_community_scripts_repo)
  when: observer_community_scripts_repo | default('') | length > 0
  block:
    - name: Crear SCRIPTS_DIR para community scripts
      ansible.builtin.file:
        path: /opt/trmm-community-scripts
        state: directory
        owner: "{{ observer_user }}"
        group: "{{ observer_group }}"
        mode: "0755"

    - name: Clonar/actualizar el repo de community scripts
      ansible.builtin.git:
        repo: "{{ observer_community_scripts_repo }}"
        dest: /opt/trmm-community-scripts
        version: "{{ observer_community_scripts_version | default('main') }}"
      become: true
      become_user: "{{ observer_user }}"

    - name: Cargar community scripts en la BD (load_community_scripts)
      ansible.builtin.command:
        cmd: "{{ observer_root }}/api/env/bin/python manage.py load_community_scripts"
        chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
      become: true
      become_user: "{{ observer_user }}"
      environment:
        DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
      changed_when: true

- name: Aviso si no se provisionan community scripts
  ansible.builtin.debug:
    msg: >
      observer_community_scripts_repo no definido — se omite load_community_scripts.
      El producto funciona sin la librería de scripts comunitarios; definir el repo
      (decisión BrainCorp, O-COMMUNITY-SCRIPTS) para habilitarla.
  when: observer_community_scripts_repo | default('') | length == 0

# R-04 / CONTRACT-01 — genera nats-rmm.conf con user `observerrmm`
# (no `tacticalrmm` legacy). Backend Django en observerrmm/utils.py:178-256
# escribe el JSON config con `users[0].user = "observerrmm"` y luego intenta
# `nats-server -signal reload` (silenciado si el binario no existe todavía
# — primer deploy: NATS se instala después y arranca leyendo este conf).
- name: Ejecutar Django reload_nats (cierre R-04 — genera nats-rmm.conf con user observerrmm)
  ansible.builtin.command:
    cmd: "{{ observer_root }}/api/env/bin/python manage.py reload_nats"
    chdir: "{{ observer_root }}/api/{{ observer_app_name }}"
    creates: "{{ observer_root }}/api/{{ observer_app_name }}/nats-rmm.conf"
  become: true
  become_user: "{{ observer_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ observer_app_name }}.settings"
  register: reload_nats_result

- name: Verificar que nats-rmm.conf contiene user observerrmm (smoke test R-04)
  ansible.builtin.command:
    cmd: "grep -q '\"observerrmm\"' {{ observer_root }}/api/{{ observer_app_name }}/nats-rmm.conf"
  changed_when: false
  register: nats_user_grep
  failed_when: nats_user_grep.rc != 0
