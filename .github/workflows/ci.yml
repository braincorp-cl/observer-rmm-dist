---
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # La version del producto tiene que tener SIEMPRE su entrada en el CHANGELOG.
  # No es cosmetico: la consola enlaza el aviso de "version disponible" al ancla
  # #v{ORMM_VERSION} del changelog publico, asi que una version sin entrada deja
  # ese enlace roto para toda la flota. Paso de verdad con v1.4.1, que estuvo
  # desplegada en produccion sin entrada hasta el 2026-07-26.
  # Esto corre en cada push (no solo al taggear) para que el hueco se vea temprano.
  changelog:
    name: Changelog al dia
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: ORMM_VERSION tiene entrada en CHANGELOG.md
        run: |
          VER=$(grep -oP '^ORMM_VERSION = "\K[^"]+' api/observerrmm/observerrmm/settings.py)
          if [ -z "$VER" ]; then
            echo "::error::No se pudo leer ORMM_VERSION de settings.py."
            exit 1
          fi
          if ! grep -q "^## v${VER} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md no tiene la entrada '## v${VER}'. La consola enlaza el ancla #v${VER} y quedaria roto (ver release-notes/README.md)."
            exit 1
          fi
          echo "OK: ORMM_VERSION ${VER} tiene su entrada en el CHANGELOG."

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # ansible-core >=2.22 (ver requirements.txt) requiere Python >=3.12
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # `ansible.cfg` fija `vault_password_file = .vault_pass`, y ansible-core
      # VALIDA ese archivo al arrancar aunque no haya nada que descifrar: si esta
      # vacio, `ansible-playbook --syntax-check` muere con "Invalid vault password"
      # y ansible-lint lo reporta como 15 `internal-error`.
      #
      # Los PRs de Dependabot NO reciben los secretos de Actions (GitHub les da un
      # almacen aparte, que aca esta vacio a proposito), asi que el secreto
      # resolvia a cadena vacia y TODO PR de Dependabot nacia rojo. Medido el
      # 2026-08-06 en los PRs #1 y #2.
      #
      # El marcador es seguro y no baja la cobertura: en este repo NO hay ningun
      # fichero cifrado (`group_vars/*/vault.yml` esta en .gitignore; la unica
      # mencion a `$ANSIBLE_VAULT` es una condicion en install.yml:233). Se
      # verifico en local: con el archivo vacio ansible-lint da RC=2, con marcador
      # RC=0 y el mismo conjunto de reglas. Si algun dia se versiona contenido
      # cifrado, el camino del secreto real sigue intacto y es el que se usa en
      # push a main; lo que fallaria seria el PR de Dependabot, que es la senal
      # correcta.
      #
      # Deliberadamente NO se copia el secreto al almacen de Dependabot: eso lo
      # expondria a workflows que corren en ramas propuestas por un bot que, entre
      # otras cosas, bumpea acciones de terceros.
      - name: Write vault password file
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          if [ -n "$ANSIBLE_VAULT_PASSWORD" ]; then
            printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .vault_pass
            echo "vault: secreto real"
          else
            printf '%s' 'sin-secreto-nada-en-este-repo-esta-cifrado' > .vault_pass
            echo "::notice::Sin ANSIBLE_VAULT_PASSWORD (PR de Dependabot). Se usa marcador; no hay ficheros cifrados versionados."
          fi
          chmod 600 .vault_pass

      - name: ansible-lint
        run: ansible-lint

  # Compilacion del binario Go. Este repo tiene un `go.mod` propio (modulo
  # `observer-rmm-dist`, el `nats-api` de main.go) y hasta el 2026-08-06 NINGUN
  # job lo construia: los gates eran ansible-lint y Django, y el Go pasaba sin
  # que nadie lo mirara.
  #
  # El hueco se destapo con el PR #2 de Dependabot, que subia `nats.go` a v1.52.0
  # y con eso arrastraba la directiva `go 1.23.12 -> 1.25.0`. Todos sus checks
  # daban verde y ninguno decia si el arbol seguia compilando.
  #
  # 🪤 Ojo con lo que este job NO cubre: el binario desplegado va VERSIONADO en
  # `roles/observer_api/files/nats-api` y Ansible lo COPIA (tasks/main.yml:220),
  # no lo compila. O sea que un `go.mod` verde aca no implica que produccion tenga
  # ese codigo: hay que recompilar y commitear el binario a mano.
  #
  # `go-version-file: go.mod` a proposito: el toolchain de la CI sigue a la
  # directiva del repo, asi que un PR que la suba se construye con la version que
  # pide, y si no compila se ve en el PR.
  go:
    name: nats-api (go build + vet)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build -v ./...

      - name: go vet
        run: go vet ./...

  # Gates del backend Django. Vivian en el hub (`observer-rmm`,
  # .github/workflows/ci-tests.yml) y se movieron aca el 2026-08-03 por decision
  # del usuario, porque estaban en el repo equivocado y se puede demostrar:
  #
  #   - Este repo es la fuente unica del codigo (ADR-016) y desde aca se
  #     despliega. El hub quedo para specs del Reversa y codigo canonico del
  #     primer fork, NO para codigo fuente vivo.
  #   - La copia del hub estaba incompleta y atrasada: a su `agents/views.py` le
  #     faltaban 382 lineas (la feature 028 entera) y le faltaban 5 archivos que
  #     si existen aca. O sea que los gates validaban una copia parcial y vieja.
  #   - Y encima no corrian: el workflow del hub se dispara con push/PR y el hub
  #     no recibe un push desde el 2026-05-17, con 357 commits locales.
  #
  # Medido el dia del traslado: `black` daba 16 archivos aca contra 11 en el hub
  # — no porque el hub estuviera mas limpio, sino porque tiene menos codigo.
  #
  # Sin codecov a proposito: este repo es privado y la accion necesitaria token.
  # El `coverage.xml` se genera igual (lo pide `pytest.ini`).
  backend:
    name: Backend Django (black + flake8 + pytest)
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pipeline
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline123456
        ports:
          - 5432:5432
        # El healthcheck no estaba en el workflow del hub. Se agrega porque sin
        # el los pasos arrancan antes de que Postgres acepte conexiones y la
        # falla sale como un error de BD que no tiene nada que ver con el codigo.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.8"
          check-latest: true

      # 4 tests de `core` lo necesitan (backend de resultados de Celery y el
      # consumer WS). Sin redis fallan con ConnectionError y parecen rotos del
      # codigo, que es peor que no correrlos.
      - name: Install redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis
          redis-server --version

      - name: Install requirements
        working-directory: api/observerrmm
        run: |
          python --version
          SETTINGS_FILE="observerrmm/settings.py"
          SETUPTOOLS_VER=$(grep "^SETUPTOOLS_VER" "$SETTINGS_FILE" | awk -F'[= "]' '{print $5}')
          WHEEL_VER=$(grep "^WHEEL_VER" "$SETTINGS_FILE" | awk -F'[= "]' '{print $5}')
          pip install pip==25.1
          pip install setuptools==${SETUPTOOLS_VER} wheel==${WHEEL_VER}
          pip install -r requirements.txt -r requirements-test.txt

      # TODA la cadena de pruebas va pinneada en requirements-test.txt (black
      # incluido). Sin pin, el gate se pone rojo solo el dia que un paquete de
      # terceros publica una version nueva, sin que nadie toque el codigo. El
      # porque de cada pin esta en la cabecera de ese archivo.
      - name: Codestyle black
        working-directory: api
        run: black --exclude migrations/ --check --diff observerrmm

      - name: Lint with flake8
        working-directory: api/observerrmm
        run: flake8 --config .flake8 .

      - name: Run django tests
        env:
          GHACTIONS: "yes"
        working-directory: api/observerrmm
        run: pytest

  # NOTA: el job `molecule` se removió (2026-06-28). Estaba mal configurado para
  # el driver docker — el inventario all-in-one fija localhost+connection:local,
  # así que el converge corría install.yml sobre el runner en vez del contenedor,
  # y nunca pasó. El greenfield se valida manualmente en VMs reales. Reescribir
  # molecule (inventario propio del scenario apuntando a la instancia del
  # contenedor) queda como mejora futura. Los scenarios viven en molecule/.
