---
# healthcheck.yml — Verificación post-install del sistema Observer RMM
# Uso: ansible-playbook healthcheck.yml -i inventory/production.yml --ask-vault-pass

- name: Healthcheck — PostgreSQL
  hosts: observer_db
  gather_facts: false
  tasks:
    # Chequeo LOCAL en el host (PG bindea local + UFW bloquea acceso externo;
    # delegar a localhost/control-node daba timeout contra la IP externa).
    - name: Verificar puerto 5432
      ansible.builtin.wait_for:
        host: localhost
        port: 5432
        timeout: 10

- name: Healthcheck — Redis
  hosts: observer_redis
  gather_facts: false
  tasks:
    - name: Verificar puerto 6379
      ansible.builtin.wait_for:
        host: localhost
        port: 6379
        timeout: 10

- name: Healthcheck — MeshCentral
  hosts: observer_mesh
  gather_facts: false
  tasks:
    - name: Verificar puerto 4430
      ansible.builtin.wait_for:
        host: localhost
        port: 4430
        timeout: 15

- name: Healthcheck — API (uWSGI socket)
  hosts: observer_api
  gather_facts: false
  tasks:
    # uWSGI bindea un socket unix (app.ini), NO :8000. Verificar el socket, no el puerto.
    - name: Verificar socket uWSGI del API
      ansible.builtin.stat:
        path: "{{ observer_root }}/api/{{ observer_app_name }}/observerrmm.sock"
      register: rmm_uwsgi_sock
      failed_when: not rmm_uwsgi_sock.stat.exists

    - name: Verificar NATS en puerto 4222
      ansible.builtin.wait_for:
        host: localhost
        port: 4222
        timeout: 10

    - name: Verificar servicios systemd del API
      ansible.builtin.systemd:
        name: "{{ item }}"
      register: svc_status
      loop:
        - rmm
        - daphne
        - celery
        - celerybeat
        - nats
        - nats-api

    - name: Validar que todos los servicios están activos
      ansible.builtin.assert:
        that:
          - item.status.ActiveState == "active"
        fail_msg: "Servicio {{ item.item }} no está activo (estado: {{ item.status.ActiveState }})"
      loop: "{{ svc_status.results }}"

- name: Healthcheck — Proxy (endpoint público)
  hosts: observer_proxy
  gather_facts: false
  tasks:
    - name: Verificar HTTP redirect en puerto 80
      ansible.builtin.wait_for:
        host: localhost
        port: 80
        timeout: 10

    - name: Verificar HTTPS en puerto 443
      ansible.builtin.wait_for:
        host: localhost
        port: 443
        timeout: 10

    # /core/version/ es un endpoint protegido real (Observer/TacticalRMM NO usa prefijo
    # /api/): sin token devuelve 401, probando toda la cadena nginx→uwsgi→Django→DRF auth.
    # El host se auto-resuelve vía /etc/hosts (observer_common, install.sh L203-219).
    - name: Verificar endpoint protegido del API retorna 401
      ansible.builtin.uri:
        url: "https://{{ observer_domain }}/core/version/"
        status_code: 401
        validate_certs: true
      register: api_result

    - name: Verificar health endpoint del API retorna 200
      ansible.builtin.uri:
        url: "https://{{ observer_domain }}/"
        status_code: 200
        validate_certs: true
      register: api_health

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg: >
          API OK — /core/version/ retornó {{ api_result.status }} (401 auth enforced),
          / retornó {{ api_health.status }} (health {{ api_health.json.status | default('?') }})
