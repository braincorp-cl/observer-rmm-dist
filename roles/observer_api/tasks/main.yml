---
# Kernel tuning (backport v1.5.1 B2): la cola de escucha de uWSGI (`listen` en app.ini,
# default 1024) queda recortada por net.core.somaxconn. Subirla persiste en
# /etc/sysctl.d/ y se aplica al vuelo (reload), sin reboot. Debe correr antes de arrancar
# el servicio rmm (uWSGI). Espejo del patrón sysctl usado en observer_db (HugePages).
- name: Subir net.core.somaxconn para la cola de escucha de uWSGI
  ansible.posix.sysctl:
    name: net.core.somaxconn
    value: "{{ observer_api_somaxconn }}"
    sysctl_file: /etc/sysctl.d/60-observer-somaxconn.conf
    reload: true
    state: present

# Python 3.11.8 compilado desde fuente — método del install.sh original.
# Reemplaza el PPA deadsnakes (no oficial): ver roles/observer_python.
- name: Instalar Python desde fuente (método install.sh)
  ansible.builtin.include_role:
    name: observer_python

# Librerías de sistema para WeasyPrint (ee/reporting genera PDFs) —
# espejo del install.sh líneas 549-552 (rama ubuntu)
- name: Instalar dependencias de sistema de WeasyPrint
  ansible.builtin.apt:
    name:
      - libpango-1.0-0
      - libharfbuzz0b
      - libpangoft2-1.0-0
    state: present
    update_cache: true

# Directorios
- name: Crear directorios del API
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ observer_user }}"
    group: "{{ observer_group }}"
    mode: "0755"
  loop:
    - "{{ observer_root }}/api"
    - "{{ observer_root }}/api/{{ observer_app_name }}"
    # Paquete Django interno (observerrmm/observerrmm/): local_settings.py se despliega
    # acá ANTES del sync de código (django_deploy.yml). En greenfield este dir aún no
    # existe → el deploy de local_settings falla. Lo creamos explícitamente; el sync
    # posterior (sin --delete) rellena el resto sin pisar local_settings.py.
    - "{{ observer_root }}/api/{{ observer_app_name }}/{{ observer_app_name }}"
    - "{{ observer_root }}/backups"
    # /var/log/celery debe existir y ser de observer ANTES de arrancar celery:
    # celery multi (como user observer) hace os.makedirs('/var/log/celery') y, si
    # no existe, falla con PermissionError bajo /var/log -> crash-loop del servicio.
    # (= install.sh líneas 383-384: mkdir -p /var/log/celery + chown al user de servicio.)
    - /var/log/celery
    # Reporting (ee/reporting): assets + schemas (= install.sh líneas 559-561).
    - "{{ observer_root }}/reporting/assets"
    - "{{ observer_root }}/reporting/schemas"

# Virtualenv
- name: Crear virtualenv Python {{ observer_python_version }}
  ansible.builtin.command:
    cmd: "python{{ observer_python_version }} -m venv {{ observer_root }}/api/env"
    creates: "{{ observer_root }}/api/env/bin/activate"
  become: true
  become_user: "{{ observer_user }}"

# uWSGI e uvicorn
- name: Instalar uWSGI y uvicorn en el venv
  ansible.builtin.pip:
    name:
      - uwsgi
      - uvicorn
      - setuptools==80.9.0
      - wheel==0.45.1
    virtualenv: "{{ observer_root }}/api/env"
    state: present
  become: true
  become_user: "{{ observer_user }}"

# Configuración Django — DEBE ir en el paquete interno (junto a settings.py): settings.py
# hace `from .local_settings import *` (import relativo = observerrmm.local_settings). El dir
# externo {{ observer_app_name }}/ tiene manage.py; el paquete está en
# {{ observer_app_name }}/{{ observer_app_name }}/. Si se deja afuera, el import falla,
# suppress(ImportError) lo traga y ALLOWED_HOSTS queda [] -> IndexError en settings.py:170.
- name: Desplegar local_settings.py
  ansible.builtin.template:
    src: local_settings.j2
    dest: "{{ observer_root }}/api/{{ observer_app_name }}/{{ observer_app_name }}/local_settings.py"
    owner: "{{ observer_user }}"
    group: "{{ observer_group }}"
    mode: "0640"
  notify:
    - restart rmm
    - restart daphne
    - restart celery
    - restart celerybeat

# NATS Server — instalar el binario ANTES del setup de Django: reload_nats (dentro de
# django_deploy) ejecuta `nats-server -signal reload`; si el binario no existe,
# subprocess.run lanza FileNotFoundError y revienta el deploy. El install.sh instala
# nats-server antes del setup de Django por esta razón. (El servicio se arranca al final;
# aquí solo se descarga el binario, así que no necesita aún el nats-rmm.conf.)
- name: Instalar NATS Server {{ observer_nats_version }}
  ansible.builtin.include_tasks: nats.yml

# Django setup — sync código + pip + migrate + collectstatic + reload_nats (R-04)
- name: Setup Django (código + dependencias + migrate + collectstatic + reload_nats)
  ansible.builtin.include_tasks: django_deploy.yml

# Reporting (ee/reporting) — chromium para Kaleido (W005). Los reportes con gráficos en
# formato "image" (SVG; obligatorio en PDF porque WeasyPrint no ejecuta JS) usan Kaleido,
# que desde 1.x ya NO empaqueta su propio chromium: lo lanza del sistema. plotly.io.get_chrome()
# descarga un chromium versión-matcheada a la caché de Kaleido, que Kaleido autodescubre al
# renderizar. HOME se fija a {{ observer_root }} (= HOME de rmm/daphne/celery) para que la
# caché quede donde esos servicios la encuentran. DEBE correr DESPUÉS de django_deploy (que
# instala plotly/kaleido en el venv). Idempotente vía marcador (una sola descarga por host).
- name: Provisionar chromium para Kaleido (reportes con gráficos)
  when: observer_reporting_charts_enabled | bool
  block:
    - name: Verificar si el chromium de Kaleido ya está provisionado
      ansible.builtin.stat:
        path: "{{ observer_root }}/reporting/.kaleido-chrome-provisioned"
      register: observer_kaleido_chrome_marker

    - name: Descargar chromium para Kaleido (plotly.io.get_chrome)
      ansible.builtin.command:
        cmd: >-
          {{ observer_root }}/api/env/bin/python -c
          "import plotly.io as pio; pio.get_chrome()"
      become: true
      become_user: "{{ observer_user }}"
      environment:
        HOME: "{{ observer_root }}"
      register: observer_kaleido_chrome_install
      changed_when: observer_kaleido_chrome_install.rc == 0
      when: not observer_kaleido_chrome_marker.stat.exists

    - name: Marcar el chromium de Kaleido como provisionado
      ansible.builtin.file:
        path: "{{ observer_root }}/reporting/.kaleido-chrome-provisioned"
        state: touch
        owner: "{{ observer_user }}"
        group: "{{ observer_group }}"
        mode: "0644"
      when: observer_kaleido_chrome_install is changed

- name: Aviso si no se provisiona chromium para gráficos de reportes
  ansible.builtin.debug:
    msg: >
      observer_reporting_charts_enabled=false — se omite la provisión de chromium para
      Kaleido. Los reportes de texto/tabla y los PDF sin gráficos funcionan igual; los
      dashboards con gráficos (formato image/SVG y HTML interactivo) requieren habilitarlo.
  when: not (observer_reporting_charts_enabled | bool)

# nats-api binary (Go). Debe estar recompilado desde el fuente actual (natsapi/svc.go
# conecta como user NATS `observerrmm`); un binario stale pre-rebrand conecta con el
# user viejo y choca con "nats: Authorization Violation". Al cambiar, reiniciar el servicio.
- name: Copiar nats-api binary
  ansible.builtin.copy:
    src: "nats-api{{ '-arm64' if ansible_facts['architecture'] == 'aarch64' else '' }}"
    dest: /usr/local/bin/nats-api
    owner: root
    group: root
    mode: "0755"
  notify: restart nats-api

# Celery conf
- name: Crear directorio /etc/conf.d
  ansible.builtin.file:
    path: /etc/conf.d
    state: directory
    mode: "0755"

- name: Desplegar celery.conf
  ansible.builtin.template:
    src: celery.conf.j2
    dest: /etc/conf.d/celery.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - restart celery
    - restart celerybeat

# Systemd services
- name: Desplegar servicios systemd del API
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: rmm.service.j2, dest: rmm.service }
    - { src: daphne.service.j2, dest: daphne.service }
    - { src: nats.service.j2, dest: nats.service }
    - { src: nats-api.service.j2, dest: nats-api.service }
    - { src: celery.service.j2, dest: celery.service }
    - { src: celerybeat.service.j2, dest: celerybeat.service }
  notify: systemd daemon-reload

- name: Habilitar y arrancar servicios del API
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - nats
    - nats-api
    - rmm
    - daphne
    - celery
    - celerybeat
