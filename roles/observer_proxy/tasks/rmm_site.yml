---
# Solo el server block del API (rmm.conf): render, nginx -t con rollback, reload
# y verificación de workers nuevos. Lo usa deploy-mcp.yml (feature 045) para no
# correr el rol completo, que también toca certificados.

- name: Desplegar rmm.conf y validarlo (revierte si algo falla)
  block:
    - name: Desplegar rmm.conf
      ansible.builtin.template:
        src: rmm.conf.j2
        dest: /etc/nginx/sites-available/rmm.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: _rmm_conf

    - name: Validar la configuración completa de nginx
      when: _rmm_conf is changed
      ansible.builtin.command: nginx -t
      changed_when: false
  rescue:
    - name: Restaurar el rmm.conf anterior
      when: _rmm_conf.backup_file is defined
      ansible.builtin.copy:
        src: "{{ _rmm_conf.backup_file }}"
        dest: /etc/nginx/sites-available/rmm.conf
        remote_src: true
        mode: "0644"

    - name: Abortar sin recargar nginx
      ansible.builtin.fail:
        msg: >-
          Falló el render o la validación de rmm.conf ({{ ansible_failed_result.msg | default('ver tarea anterior') }}).
          Si alcanzó a escribirse, se restauró el anterior; nginx no se recargó.

- name: PID del master nginx antes del reload
  when: _rmm_conf is changed
  ansible.builtin.command: cat /run/nginx.pid
  register: _nginx_pid
  changed_when: false

- name: Workers nginx antes del reload
  when: _rmm_conf is changed
  ansible.builtin.command: "pgrep -P {{ _nginx_pid.stdout }}"
  register: _workers_before
  changed_when: false

- name: Recargar nginx
  when: _rmm_conf is changed
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

# Un reload puede fallar en silencio (systemctl rc=0 sin workers nuevos): se
# verifica que el master haya levantado al menos un worker nuevo.
- name: Verificar workers nuevos tras el reload
  when: _rmm_conf is changed
  ansible.builtin.command: "pgrep -P {{ _nginx_pid.stdout }}"
  register: _workers_after
  changed_when: false
  retries: 10
  delay: 1
  until: (_workers_after.stdout_lines | difference(_workers_before.stdout_lines)) | length > 0
