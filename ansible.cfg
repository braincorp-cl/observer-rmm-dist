[defaults]
roles_path         = roles
inventory          = inventory/all-in-one.yml
retry_files_enabled = false
# 'yaml' (community.general) fue removido en community.general 12;
# el reemplazo oficial es el callback default con result_format=yaml
stdout_callback    = ansible.builtin.default
callback_result_format = yaml
callbacks_enabled  = profile_tasks
interpreter_python = auto_silent
# Endurecimiento forward-compat: los facts sólo viven bajo ansible_facts[...],
# no se inyectan como variables top-level (ansible_*). Prepara el pin ansible-core>=2.22.
inject_facts_as_vars = false
host_key_checking  = false
vault_password_file = .vault_pass

[ssh_connection]
pipelining = true
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s

[privilege_escalation]
become = true
become_method = sudo
