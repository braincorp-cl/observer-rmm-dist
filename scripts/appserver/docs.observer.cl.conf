# docs.observer.cl — sitio de documentación propio de Observer RMM.
# Reemplaza los enlaces externos (R-03). TLS lo termina el NPM corporativo;
# este backend sirve HTTP plano en :82.
Listen 82

<VirtualHost *:82>
    ServerName docs.observer.cl
    ServerAdmin soporte@observer.cl

    DocumentRoot /var/www/html/observer-docs
    DirectoryIndex index.html

    # /etc/mime.types de este servidor NO trae webp (instalacion antigua), asi que
    # Apache servia los .webp SIN Content-Type. Como el NPM manda
    # X-Content-Type-Options: nosniff, el navegador se niega a renderizarlos: daban
    # 200 y la imagen igual no aparecia. Declararlo aca es la correccion.
    AddType image/webp .webp
    AddType image/svg+xml .svg

    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.0.0.0/8


    # 301 de las rutas en espanol que estuvieron publicadas el 23 y el 24 de
    # octubre de 2026. El resto del sitio usa rutas en ingles (/functions/*,
    # /guide_*, /features/, /faq/), y estas dos rompian esa convencion ademas de
    # colgar de una jerarquia propia. Quedaron indexadas, asi que se redirigen en
    # vez de borrarse: un 404 tira el posicionamiento que ya tenian y rompe
    # cualquier enlace externo.
    #
    # RedirectMatch y no Redirect: cubre la ruta con y sin barra final. La regla
    # mas especifica va primero, porque el match es por prefijo.
    RedirectMatch 301 ^/administracion/roles/?$ https://docs.observer.cl/functions/role_catalog/
    RedirectMatch 301 ^/administracion/?$ https://docs.observer.cl/functions/user_management/

    # /videos/ dada de BAJA TEMPORAL el 2026-11-05 (commit e44678f): sus dos videos
    # muestran la consola v1. La pagina estaba indexada a proposito (entrada propia en el
    # sitemap y JSON-LD VideoObject), asi que se redirige en vez de dejarla caer.
    #
    # 🔑 VUELVE. El usuario lo decidio el 2026-11-05: la seccion se repone cuando la UI v2
    # este operativa, con los dos videos REGRABADOS sobre ella. O sea que esta regla tiene
    # fecha de vencimiento y NO debe convertirse en 301 por antiguedad: al reponer la
    # seccion se borra esta linea y listo.
    #
    # 302 y no 301 justamente por eso: un 301 le dice al buscador que la URL se movio para
    # siempre, los navegadores lo cachean de forma persistente y revertirlo sale caro.
    #
    # Sin la regla la URL da 403, no 404: publish_docs.py borra los archivos pero no las
    # colecciones, asi que /videos/ quedo como directorio vacio y el `Options -Indexes`
    # del <Directory> de abajo lo niega. Un 403 sobre una URL indexada es peor que un 404.
    # mod_alias resuelve este Redirect antes de que mod_dir llegue al directorio, asi que
    # la regla gana sin tener que borrar la carpeta.
    #
    # La media de la seccion (/assets/videos/*.mp4, *.webm, posters y VTT) NO se redirige:
    # responde 404 y corresponde, porque un 302 de un .mp4 a una pagina HTML es peor
    # senal que el 404. /assets/videos/ y /assets/shots/ quedaron tambien como directorios
    # vacios y dan 403, igual que cualquier otro directorio de assets desde el
    # endurecimiento del 2026-07-11: ahi no hay cambio de comportamiento.
    RedirectMatch 302 ^/videos/?$ https://docs.observer.cl/features/

    # Escritura por WebDAV: la usa el job publish-docs.yml para publicar el sitio
    # en cada release (push desde GitHub Actions), en vez del `sudo rsync` manual que
    # ataba la publicacion a un equipo. Credencial en
    # /etc/apache2/observer-docs-publish.htpasswd (bcrypt); el valor plano vive como
    # secret del repo (DOCS_UPLOAD_USER / DOCS_UPLOAD_PASSWORD).
    #
    # La autorizacion va METODO POR METODO dentro de un unico <Directory>, igual que en
    # agents.observer.cl.conf, para evitar ambiguedad de merge entre contenedores:
    # lectura publica (el sitio esta indexado a proposito), escritura solo autenticada,
    # y todo lo demas denegado.
    #
    # DELETE tambien va autenticado (ampliacion del 2026-10-26, a pedido del usuario):
    # el sitio se SINCRONIZA, asi que una pagina retirada del repo desaparece del aire en
    # el siguiente release en vez de quedar servida para siempre. Que hay publicado se
    # sabe por el manifiesto (ver mas abajo), no por PROPFIND.
    #
    # Esto le da a la credencial de publicacion poder para borrar el sitio. Las defensas:
    # la credencial solo vive como secret del repo, publish_docs.py aborta si la purga
    # supera un umbral (checkout vacio o parcial no arrasa el sitio), y los respaldos
    # siguen en /var/www/backups/observer-docs/.
    <Directory /var/www/html/observer-docs>
        Options -Indexes
        AllowOverride None
        DAV On
        AuthType Basic
        AuthName "Observer Docs Publish"
        AuthUserFile /etc/apache2/observer-docs-publish.htpasswd

        <Limit PUT MKCOL DELETE>
            Require valid-user
        </Limit>
        <Limit GET HEAD>
            Require all granted
        </Limit>
        <LimitExcept GET HEAD PUT MKCOL DELETE>
            Require all denied
        </LimitExcept>

        # Manifiesto de publicacion: la lista de lo que publish_docs.py dejo servido en
        # la corrida anterior, que es como sabe que borrar ahora. No se usa PROPFIND
        # para eso: sobre una coleccion con index.html lo resuelve mod_dir y Apache
        # responde 405, y forzar DirectoryIndex disabled para los demas metodos tumba la
        # lectura publica (probado el 26-oct: el sitio entero quedo en 403 ~40 s).
        # Lectura solo autenticada: no es secreto (el sitio es publico e indexado) pero
        # no hay razon para publicar el inventario.
        <Files ".publish-manifest">
            <Limit GET HEAD>
                Require valid-user
            </Limit>
        </Files>
    </Directory>

    # Nunca servir respaldos ni temporales. El sitio esta indexado, asi que un
    # .bak dentro del docroot es contenido duplicado y publico: el 2026-07-26 habia
    # 13 archivos respondiendo 200 con versiones viejas de cada pagina. Los
    # respaldos van FUERA del docroot (/var/www/backups/observer-docs/).
    <FilesMatch "([.]bak|~$|[.]orig$|[.]swp$)">
        Require all denied
    </FilesMatch>

    # El README del docs-site documenta el mapeo con la consola y el
    # procedimiento de despliegue: IP interna del appserver, DocumentRoot y el
    # mapeo del NPM. Se copia al docroot junto con el resto del directorio, y
    # este sitio esta indexado A PROPOSITO (robots.txt: Allow: /), asi que
    # respondia 200 y publicaba topologia interna. Se niega aca, y no sacandolo
    # del docroot, para que un despliegue futuro no lo reponga en silencio.
    <Files "README.md">
        Require all denied
    </Files>


    ErrorLog ${APACHE_LOG_DIR}/docs.observer.cl-error.log
    CustomLog ${APACHE_LOG_DIR}/docs.observer.cl-access.log vhost_combined
</VirtualHost>
